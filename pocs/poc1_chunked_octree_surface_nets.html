<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 1: Chunked Octree Surface Nets with Async Web Workers</title>
    <style>
        body { margin: 0; overflow: hidden; background: #04060c; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from './vendor/three.module.js';
        import { PlanetaryBaseSandbox } from './shared/planetary_base_sandbox.js';

        // --- Fast 3D Simplex-Style Noise for Procedural Asteroid Form ---
        class FastNoise3D {
            constructor(seed = 1337) { this.seed = seed; }
            hash(x, y, z) {
                const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + this.seed) * 43758.5453123;
                return s - Math.floor(s);
            }
            noise(x, y, z) {
                const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
                const xd = x - X, yd = y - Y, zd = z - Z;
                const u = xd * xd * (3.0 - 2.0 * xd);
                const v = yd * yd * (3.0 - 2.0 * yd);
                const w = zd * zd * (3.0 - 2.0 * zd);
                const c000 = this.hash(X, Y, Z), c100 = this.hash(X+1, Y, Z);
                const c010 = this.hash(X, Y+1, Z), c110 = this.hash(X+1, Y+1, Z);
                const c001 = this.hash(X, Y, Z+1), c101 = this.hash(X+1, Y, Z+1);
                const c011 = this.hash(X, Y+1, Z+1), c111 = this.hash(X+1, Y+1, Z+1);
                const x00 = c000*(1-u)+c100*u, x10 = c010*(1-u)+c110*u;
                const x01 = c001*(1-u)+c101*u, x11 = c011*(1-u)+c111*u;
                const y0 = x00*(1-v)+x10*v, y1 = x01*(1-v)+x11*v;
                return y0*(1-w)+y1*w;
            }
            fbm(x, y, z, octaves = 3) {
                let val = 0, amp = 0.5, freq = 1.0;
                for (let i = 0; i < octaves; i++) {
                    val += this.noise(x * freq, y * freq, z * freq) * amp;
                    freq *= 2.0; amp *= 0.5;
                }
                return val;
            }
        }

        const noise = new FastNoise3D(2026);

        // --- Option 1 Constants ---
        let currentRadius = 2800;
        const CHUNK_RES = 16; // 16x16x16 cells
        let CHUNK_SIZE = 900;  // Dynamically scaled
        let CELL_SIZE = CHUNK_SIZE / CHUNK_RES;

        // Sparse Chunks Map
        const chunkMap = new Map(); // key 'cx,cy,cz' => Chunk object
        const activeChunkMeshes = [];

        // Worker Pool
        const WORKER_COUNT = 3;
        const workerPool = [];
        let workerIndex = 0;

        for (let i = 0; i < WORKER_COUNT; i++) {
            const worker = new Worker(new URL('workers/surface_nets_worker.js', window.location.href).href);
            worker.busy = false;
            workerPool.push(worker);
        }

        function getNextWorker() {
            const available = workerPool.find(w => !w.busy);
            if (available) return available;
            workerIndex = (workerIndex + 1) % workerPool.length;
            return workerPool[workerIndex];
        }

        // Shared Standard Material with Vertex Colors
        const chunkMaterial = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.65,
            metalness: 0.25,
            flatShading: false,
            side: THREE.FrontSide
        });

        class VoxelChunk {
            constructor(cx, cy, cz) {
                this.cx = cx;
                this.cy = cy;
                this.cz = cz;
                this.key = `${cx},${cy},${cz}`;
                this.minBounds = new THREE.Vector3(cx * CHUNK_SIZE, cy * CHUNK_SIZE, cz * CHUNK_SIZE);
                this.maxBounds = this.minBounds.clone().addScalar(CHUNK_SIZE);
                this.center = this.minBounds.clone().addScalar(CHUNK_SIZE * 0.5);

                const pRes = CHUNK_RES + 3;
                const totalVoxels = pRes * pRes * pRes;
                this.voxelData = new Float32Array(totalVoxels);
                this.materialData = new Uint8Array(totalVoxels);

                this.mesh = null;
                this.isDirty = true;
                this.isGenerating = false;

                this.initVoxels();
            }

            initVoxels() {
                const pRes = CHUNK_RES + 3;
                let idx = 0;
                for (let pz = 0; pz < pRes; pz++) {
                    const wz = this.minBounds.z + (pz - 1) * CELL_SIZE;
                    for (let py = 0; py < pRes; py++) {
                        const wy = this.minBounds.y + (py - 1) * CELL_SIZE;
                        for (let px = 0; px < pRes; px++) {
                            const wx = this.minBounds.x + (px - 1) * CELL_SIZE;
                            const dist = Math.sqrt(wx * wx + wy * wy + wz * wz);
                            // Procedural asteroid with craters & noise
                            const n = noise.fbm(wx * 0.0015, wy * 0.0015, wz * 0.0015, 3) * (currentRadius * 0.18);
                            // Signed distance: negative = solid inside, positive = empty space outside
                            const d = dist - (currentRadius + n);
                            this.voxelData[idx] = d;

                            // Material: 1 = Rock, 2 = Ore Vein
                            if (d < 0 && Math.sin(wx * 0.006) * Math.cos(wz * 0.006) > 0.65) {
                                this.materialData[idx] = 2; // Ore vein
                            } else {
                                this.materialData[idx] = 1; // Native rock
                            }
                            idx++;
                        }
                    }
                }
            }

            rebuildMesh(scene) {
                if (this.isGenerating) return;
                this.isGenerating = true;

                const worker = getNextWorker();
                worker.busy = true;

                // Clone buffers for worker transfer
                const voxelCopy = new Float32Array(this.voxelData);
                const matCopy = new Uint8Array(this.materialData);

                const handleMessage = (e) => {
                    worker.removeEventListener('message', handleMessage);
                    worker.busy = false;
                    this.isGenerating = false;

                    const { positions, normals, colors, materials, indices } = e.data;

                    if (positions.length === 0 || indices.length === 0) {
                        if (this.mesh) {
                            scene.remove(this.mesh);
                            const mIdx = activeChunkMeshes.indexOf(this.mesh);
                            if (mIdx !== -1) activeChunkMeshes.splice(mIdx, 1);
                            this.mesh.geometry.dispose();
                            this.mesh = null;
                        }
                        return;
                    }

                    if (!this.mesh) {
                        const geo = new THREE.BufferGeometry();
                        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                        geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
                        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                        geo.setIndex(new THREE.BufferAttribute(indices, 1));

                        this.mesh = new THREE.Mesh(geo, chunkMaterial);
                        this.mesh.userData = { chunk: this };
                        scene.add(this.mesh);
                        activeChunkMeshes.push(this.mesh);
                    } else {
                        const geo = this.mesh.geometry;
                        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                        geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
                        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                        geo.setIndex(new THREE.BufferAttribute(indices, 1));
                        geo.attributes.position.needsUpdate = true;
                        geo.attributes.normal.needsUpdate = true;
                        geo.attributes.color.needsUpdate = true;
                        geo.computeBoundingSphere();
                        geo.computeBoundingBox();
                    }
                };

                worker.addEventListener('message', handleMessage);
                worker.postMessage({
                    chunkId: this.key,
                    res: CHUNK_RES,
                    voxelData: voxelCopy,
                    materialData: matCopy,
                    minBounds: [this.minBounds.x, this.minBounds.y, this.minBounds.z],
                    cellSize: CELL_SIZE
                }, [voxelCopy.buffer, matCopy.buffer]);
            }
        }

        // Initialize Chunks around asteroid surface
        function initAsteroidChunks(scene) {
            // Clean up existing
            activeChunkMeshes.forEach(m => {
                scene.remove(m);
                m.geometry.dispose();
            });
            activeChunkMeshes.length = 0;
            chunkMap.clear();

            CHUNK_SIZE = currentRadius * 0.65;
            CELL_SIZE = CHUNK_SIZE / CHUNK_RES;

            const boundChunks = Math.ceil((currentRadius * 1.3) / CHUNK_SIZE);

            for (let cz = -boundChunks; cz <= boundChunks; cz++) {
                for (let cy = -boundChunks; cy <= boundChunks; cy++) {
                    for (let cx = -boundChunks; cx <= boundChunks; cx++) {
                        const chunkCenter = new THREE.Vector3((cx + 0.5) * CHUNK_SIZE, (cy + 0.5) * CHUNK_SIZE, (cz + 0.5) * CHUNK_SIZE);
                        const distToOrigin = chunkCenter.length();
                        // Allocate chunks intersecting asteroid surface shell
                        if (distToOrigin < currentRadius + CHUNK_SIZE * 0.9 && distToOrigin > currentRadius - CHUNK_SIZE * 0.9) {
                            const chunk = new VoxelChunk(cx, cy, cz);
                            chunkMap.set(chunk.key, chunk);
                            chunk.rebuildMesh(scene);
                        }
                    }
                }
            }
        }

        // Initialize Shared Sandbox
        const sandbox = new PlanetaryBaseSandbox({
            pocId: 'poc1',
            pocTitle: 'Option 1: Chunked Surface Nets + Workers',
            defaultRadius: currentRadius,
            getCollisionMesh: () => activeChunkMeshes,
            getVisualMesh: () => activeChunkMeshes,

            // Continuous Spherical Laser Carve Invariant
            onCarve: async (hitPoint, hitNormal, brushRadius, mode) => {
                const pRes = CHUNK_RES + 3;
                const affectedChunks = new Set();

                // Find all chunks intersecting brush sphere
                chunkMap.forEach(chunk => {
                    const chunkBox = new THREE.Box3(chunk.minBounds, chunk.maxBounds);
                    const sphere = new THREE.Sphere(hitPoint, brushRadius + CELL_SIZE * 2);
                    if (chunkBox.intersectsSphere(sphere)) {
                        affectedChunks.add(chunk);
                    }
                });

                affectedChunks.forEach(chunk => {
                    let idx = 0;
                    let modified = false;
                    for (let pz = 0; pz < pRes; pz++) {
                        const wz = chunk.minBounds.z + (pz - 1) * CELL_SIZE;
                        for (let py = 0; py < pRes; py++) {
                            const wy = chunk.minBounds.y + (py - 1) * CELL_SIZE;
                            for (let px = 0; px < pRes; px++) {
                                const wx = chunk.minBounds.x + (px - 1) * CELL_SIZE;
                                const distToCenter = Math.sqrt((wx - hitPoint.x)**2 + (wy - hitPoint.y)**2 + (wz - hitPoint.z)**2);

                                if (distToCenter <= brushRadius) {
                                    // Exact continuous carve equation:
                                    // d_new(x) = max(d(x), R_brush - ||x - p_hit||)
                                    const carveD = brushRadius - distToCenter;
                                    if (carveD > chunk.voxelData[idx]) {
                                        chunk.voxelData[idx] = carveD;
                                        modified = true;
                                    }
                                }
                                idx++;
                            }
                        }
                    }
                    if (modified) {
                        chunk.rebuildMesh(sandbox.scene);
                    }
                });
            },

            // Nanite Titanium Armor Beam Reinforcement
            onReinforce: async (hitPoint, hitNormal, brushRadius) => {
                const pRes = CHUNK_RES + 3;
                chunkMap.forEach(chunk => {
                    const chunkBox = new THREE.Box3(chunk.minBounds, chunk.maxBounds);
                    const sphere = new THREE.Sphere(hitPoint, brushRadius + CELL_SIZE * 2);
                    if (chunkBox.intersectsSphere(sphere)) {
                        let idx = 0;
                        let modified = false;
                        for (let pz = 0; pz < pRes; pz++) {
                            const wz = chunk.minBounds.z + (pz - 1) * CELL_SIZE;
                            for (let py = 0; py < pRes; py++) {
                                const wy = chunk.minBounds.y + (py - 1) * CELL_SIZE;
                                for (let px = 0; px < pRes; px++) {
                                    const wx = chunk.minBounds.x + (px - 1) * CELL_SIZE;
                                    const dist = Math.sqrt((wx - hitPoint.x)**2 + (wy - hitPoint.y)**2 + (wz - hitPoint.z)**2);
                                    if (dist <= brushRadius && chunk.voxelData[idx] < 0) {
                                        chunk.materialData[idx] = 3; // Reinforced Titanium Bulkhead
                                        modified = true;
                                    }
                                    idx++;
                                }
                            }
                        }
                        if (modified) {
                            chunk.rebuildMesh(sandbox.scene);
                        }
                    }
                });
            },

            checkMaterialAtHit: (point, hit) => {
                // If hitting a mesh with titanium vertex color
                if (hit && hit.face) {
                    const colAttr = hit.object.geometry.attributes.color;
                    if (colAttr) {
                        const a = hit.face.a;
                        // Titanium has high blue/cyan: colAttr.getY(a) > 0.8 && colAttr.getZ(a) > 0.9
                        if (colAttr.getY(a) > 0.8 && colAttr.getZ(a) > 0.9) {
                            return true;
                        }
                    }
                }
                return false;
            },

            onScaleChange: (scaleKey, radius) => {
                currentRadius = radius;
                initAsteroidChunks(sandbox.scene);
            },

            onToggleWireframe: (enabled) => {
                chunkMaterial.wireframe = enabled;
            },

            onToggleXRay: (enabled, plane) => {
                chunkMaterial.clippingPlanes = enabled ? [plane] : [];
                chunkMaterial.needsUpdate = true;
            }
        });

        // Initial Build
        initAsteroidChunks(sandbox.scene);
    </script>
</body>
</html>
