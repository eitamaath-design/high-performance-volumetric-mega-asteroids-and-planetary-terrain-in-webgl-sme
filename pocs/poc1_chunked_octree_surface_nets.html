<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 1: Chunked Octree Surface Nets with Async Web Workers</title>
    <style>
        body { margin: 0; overflow: hidden; background: #04060c; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from './vendor/three.module.js';
        import { PlanetaryBaseSandbox, createTriplanarAsteroidMaterial, findSurfacePoint } from './shared/planetary_base_sandbox.js';

        // --- Fast 3D Simplex-Style Noise for Procedural Asteroid Form ---
        class FastNoise3D {
            constructor(seed = 1337) { this.seed = seed; }
            hash(x, y, z) {
                const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + this.seed) * 43758.5453123;
                return s - Math.floor(s);
            }
            noise(x, y, z) {
                const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
                const xd = x - X, yd = y - Y, zd = z - Z;
                const u = xd * xd * (3.0 - 2.0 * xd);
                const v = yd * yd * (3.0 - 2.0 * yd);
                const w = zd * zd * (3.0 - 2.0 * zd);
                const c000 = this.hash(X, Y, Z), c100 = this.hash(X+1, Y, Z);
                const c010 = this.hash(X, Y+1, Z), c110 = this.hash(X+1, Y+1, Z);
                const c001 = this.hash(X, Y, Z+1), c101 = this.hash(X+1, Y, Z+1);
                const c011 = this.hash(X, Y+1, Z+1), c111 = this.hash(X+1, Y+1, Z+1);
                const x00 = c000*(1-u)+c100*u, x10 = c010*(1-u)+c110*u;
                const x01 = c001*(1-u)+c101*u, x11 = c011*(1-u)+c111*u;
                const y0 = x00*(1-v)+x10*v, y1 = x01*(1-v)+x11*v;
                return y0*(1-w)+y1*w;
            }
            fbm(x, y, z, octaves = 3) {
                let val = 0, amp = 0.5, freq = 1.0;
                for (let i = 0; i < octaves; i++) {
                    val += this.noise(x * freq, y * freq, z * freq) * amp;
                    freq *= 2.0; amp *= 0.5;
                }
                return val;
            }
        }

        const noise = new FastNoise3D(2026);

        // --- Option 1 Constants ---
        const QUALITY_PRESETS_POC1 = { low: 12, medium: 18, high: 24, ultra: 30 };
        let currentRadius = 2800;
        let CHUNK_RES = 24; // Configurable by quality tier (12..30 cells per chunk)
        let CHUNK_SIZE = 1260;
        let CELL_SIZE = CHUNK_SIZE / CHUNK_RES;
        let worldEpoch = 0;

        // Sparse Chunks Map
        const chunkMap = new Map(); // key 'cx,cy,cz' => VoxelChunk
        const activeChunkMeshes = [];

        // Request-ID Keyed Worker Pool
        const WORKER_COUNT = 3;
        const workerPool = [];
        const pendingCallbacks = new Map();
        let nextRequestId = 1;

        for (let i = 0; i < WORKER_COUNT; i++) {
            const worker = new Worker(new URL('workers/surface_nets_worker.js', window.location.href).href);
            worker.activeJobs = 0;
            worker.onmessage = (e) => {
                worker.activeJobs = Math.max(0, worker.activeJobs - 1);
                const cb = pendingCallbacks.get(e.data.requestId);
                if (cb) {
                    pendingCallbacks.delete(e.data.requestId);
                    cb(e.data);
                }
            };
            worker.onerror = (err) => {
                console.error('[PoC1 Worker Error]', err);
            };
            workerPool.push(worker);
        }

        function dispatchWorkerJob(payload, transferables) {
            // Pick least loaded worker
            let chosen = workerPool[0];
            for (let i = 1; i < workerPool.length; i++) {
                if (workerPool[i].activeJobs < chosen.activeJobs) {
                    chosen = workerPool[i];
                }
            }
            const requestId = nextRequestId++;
            chosen.activeJobs++;
            payload.requestId = requestId;
            return new Promise((resolve) => {
                pendingCallbacks.set(requestId, resolve);
                chosen.postMessage(payload, transferables);
            });
        }

        // Procedural 3D Triplanar Rock + Ore + Hex Titanium Bulkhead Material
        const chunkMaterial = createTriplanarAsteroidMaterial({ vertexColors: true, radius: currentRadius });

        class VoxelChunk {
            constructor(cx, cy, cz, epoch) {
                this.cx = cx;
                this.cy = cy;
                this.cz = cz;
                this.epoch = epoch;
                this.key = `${cx},${cy},${cz}`;
                this.minBounds = new THREE.Vector3(cx * CHUNK_SIZE, cy * CHUNK_SIZE, cz * CHUNK_SIZE);
                this.maxBounds = this.minBounds.clone().addScalar(CHUNK_SIZE);

                const pRes = CHUNK_RES + 5;
                const totalVoxels = pRes * pRes * pRes;
                this.voxelData = new Float32Array(totalVoxels);
                this.materialData = new Uint8Array(totalVoxels);

                this.mesh = null;
                this.isGenerating = false;
                this.needsRebuild = false;

                this.initVoxels();
            }

            initVoxels() {
                const pRes = CHUNK_RES + 5;
                let idx = 0;
                for (let pz = 0; pz < pRes; pz++) {
                    const wz = this.minBounds.z + (pz - 2) * CELL_SIZE;
                    for (let py = 0; py < pRes; py++) {
                        const wy = this.minBounds.y + (py - 2) * CELL_SIZE;
                        for (let px = 0; px < pRes; px++) {
                            const wx = this.minBounds.x + (px - 2) * CELL_SIZE;
                            const d = evalDensityPoC1(wx, wy, wz);
                            this.voxelData[idx] = d;

                            const oreFreq = 0.0055 * (2800.0 / currentRadius);
                            if (d < -CELL_SIZE && Math.sin(wx * oreFreq + wy * oreFreq * 0.36) * Math.cos(wz * oreFreq) > 0.78) {
                                this.materialData[idx] = 2; // Ore vein
                            } else {
                                this.materialData[idx] = 1; // Native rock
                            }
                            idx++;
                        }
                    }
                }
            }

            async rebuildMesh(scene) {
                if (this.isGenerating) {
                    this.needsRebuild = true;
                    return;
                }
                this.isGenerating = true;
                this.needsRebuild = false;

                const voxelCopy = new Float32Array(this.voxelData);
                const matCopy = new Uint8Array(this.materialData);

                const result = await dispatchWorkerJob({
                    chunkId: this.key,
                    res: CHUNK_RES,
                    voxelData: voxelCopy,
                    materialData: matCopy,
                    minBounds: [this.minBounds.x, this.minBounds.y, this.minBounds.z],
                    cellSize: CELL_SIZE
                }, [voxelCopy.buffer, matCopy.buffer]);

                this.isGenerating = false;

                // Discard stale results from previous planetary scale
                if (this.epoch !== worldEpoch) return;

                const { positions, normals, colors, indices } = result;

                if (positions.length === 0 || indices.length === 0) {
                    if (this.mesh) {
                        scene.remove(this.mesh);
                        const mIdx = activeChunkMeshes.indexOf(this.mesh);
                        if (mIdx !== -1) activeChunkMeshes.splice(mIdx, 1);
                        this.mesh.geometry.dispose();
                        this.mesh = null;
                    }
                } else if (!this.mesh) {
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
                    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    geo.setIndex(new THREE.BufferAttribute(indices, 1));
                    geo.computeBoundingSphere();
                    geo.computeBoundingBox();

                    this.mesh = new THREE.Mesh(geo, chunkMaterial);
                    this.mesh.userData = { chunk: this };
                    scene.add(this.mesh);
                    activeChunkMeshes.push(this.mesh);
                } else {
                    const geo = this.mesh.geometry;
                    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
                    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    geo.setIndex(new THREE.BufferAttribute(indices, 1));
                    geo.attributes.position.needsUpdate = true;
                    geo.attributes.normal.needsUpdate = true;
                    geo.attributes.color.needsUpdate = true;
                    geo.computeBoundingSphere();
                    geo.computeBoundingBox();
                }

                if (this.needsRebuild && this.epoch === worldEpoch) {
                    this.rebuildMesh(scene);
                }
            }
        }

        function getOrCreateChunk(cx, cy, cz) {
            const key = `${cx},${cy},${cz}`;
            let chunk = chunkMap.get(key);
            if (!chunk) {
                chunk = new VoxelChunk(cx, cy, cz, worldEpoch);
                chunkMap.set(key, chunk);
            }
            return chunk;
        }

        // Initialize Chunks intersecting asteroid surface shell
        async function initAsteroidChunks(scene) {
            worldEpoch++;
            activeChunkMeshes.forEach(m => {
                scene.remove(m);
                m.geometry.dispose();
            });
            activeChunkMeshes.length = 0;
            chunkMap.clear();

            CHUNK_SIZE = currentRadius * 0.45;
            CELL_SIZE = CHUNK_SIZE / CHUNK_RES;
            chunkMaterial.userData.shaderUniforms.uAsteroidRadius.value = currentRadius;

            const boundChunks = Math.ceil((currentRadius * 1.25) / CHUNK_SIZE);
            const halfDiag = CHUNK_SIZE * 0.92;
            const minShellR = currentRadius * 0.72;
            const maxShellR = currentRadius * 1.22;

            const initialRebuilds = [];
            for (let cz = -boundChunks; cz <= boundChunks; cz++) {
                for (let cy = -boundChunks; cy <= boundChunks; cy++) {
                    for (let cx = -boundChunks; cx <= boundChunks; cx++) {
                        const center = new THREE.Vector3((cx + 0.5) * CHUNK_SIZE, (cy + 0.5) * CHUNK_SIZE, (cz + 0.5) * CHUNK_SIZE);
                        const d = center.length();
                        if (d < maxShellR + halfDiag && d > minShellR - halfDiag) {
                            const chunk = new VoxelChunk(cx, cy, cz, worldEpoch);
                            chunkMap.set(chunk.key, chunk);
                            initialRebuilds.push(chunk.rebuildMesh(scene));
                        }
                    }
                }
            }
            await Promise.all(initialRebuilds);
        }

        async function carveSpherePoC1(hitPoint, brushRadius) {
            const pRes = CHUNK_RES + 5;
            const effPad = brushRadius + CELL_SIZE * 3.5;
            const minCX = Math.floor((hitPoint.x - effPad) / CHUNK_SIZE);
            const maxCX = Math.floor((hitPoint.x + effPad) / CHUNK_SIZE);
            const minCY = Math.floor((hitPoint.y - effPad) / CHUNK_SIZE);
            const maxCY = Math.floor((hitPoint.y + effPad) / CHUNK_SIZE);
            const minCZ = Math.floor((hitPoint.z - effPad) / CHUNK_SIZE);
            const maxCZ = Math.floor((hitPoint.z + effPad) / CHUNK_SIZE);

            const rebuilds = [];
            for (let cz = minCZ; cz <= maxCZ; cz++) {
                for (let cy = minCY; cy <= maxCY; cy++) {
                    for (let cx = minCX; cx <= maxCX; cx++) {
                        const chunk = getOrCreateChunk(cx, cy, cz);
                        let idx = 0;
                        let modified = false;
                        for (let pz = 0; pz < pRes; pz++) {
                            const wz = chunk.minBounds.z + (pz - 2) * CELL_SIZE;
                            for (let py = 0; py < pRes; py++) {
                                const wy = chunk.minBounds.y + (py - 2) * CELL_SIZE;
                                for (let px = 0; px < pRes; px++) {
                                    const wx = chunk.minBounds.x + (px - 2) * CELL_SIZE;
                                    const distToCenter = Math.hypot(wx - hitPoint.x, wy - hitPoint.y, wz - hitPoint.z);
                                    if (distToCenter <= brushRadius + CELL_SIZE * 2.5) {
                                        const carveD = brushRadius - distToCenter;
                                        if (carveD > chunk.voxelData[idx]) {
                                            chunk.voxelData[idx] = carveD;
                                            modified = true;
                                        }
                                    }
                                    idx++;
                                }
                            }
                        }
                        if (modified) {
                            rebuilds.push(chunk.rebuildMesh(sandbox.scene));
                        }
                    }
                }
            }
            await Promise.all(rebuilds);
        }

        async function reinforceSpherePoC1(hitPoint, brushRadius) {
            const pRes = CHUNK_RES + 5;
            const effPad = brushRadius + CELL_SIZE * 3.5;
            const minCX = Math.floor((hitPoint.x - effPad) / CHUNK_SIZE);
            const maxCX = Math.floor((hitPoint.x + effPad) / CHUNK_SIZE);
            const minCY = Math.floor((hitPoint.y - effPad) / CHUNK_SIZE);
            const maxCY = Math.floor((hitPoint.y + effPad) / CHUNK_SIZE);
            const minCZ = Math.floor((hitPoint.z - effPad) / CHUNK_SIZE);
            const maxCZ = Math.floor((hitPoint.z + effPad) / CHUNK_SIZE);

            const rebuilds = [];
            for (let cz = minCZ; cz <= maxCZ; cz++) {
                for (let cy = minCY; cy <= maxCY; cy++) {
                    for (let cx = minCX; cx <= maxCX; cx++) {
                        const key = `${cx},${cy},${cz}`;
                        const chunk = chunkMap.get(key);
                        if (!chunk) continue;

                        let idx = 0;
                        let modified = false;
                        for (let pz = 0; pz < pRes; pz++) {
                            const wz = chunk.minBounds.z + (pz - 2) * CELL_SIZE;
                            for (let py = 0; py < pRes; py++) {
                                const wy = chunk.minBounds.y + (py - 2) * CELL_SIZE;
                                for (let px = 0; px < pRes; px++) {
                                    const wx = chunk.minBounds.x + (px - 2) * CELL_SIZE;
                                    const dist = Math.hypot(wx - hitPoint.x, wy - hitPoint.y, wz - hitPoint.z);
                                    if (dist <= brushRadius && chunk.voxelData[idx] < 0) {
                                        chunk.materialData[idx] = 3; // Reinforced Titanium Bulkhead
                                        modified = true;
                                    }
                                    idx++;
                                }
                            }
                        }
                        if (modified) {
                            rebuilds.push(chunk.rebuildMesh(sandbox.scene));
                        }
                    }
                }
            }
            await Promise.all(rebuilds);
        }

        function applyQualityPoC1(qualityKey) {
            CHUNK_RES = QUALITY_PRESETS_POC1[qualityKey] || 24;
            CHUNK_SIZE = currentRadius * 0.45;
            CELL_SIZE = CHUNK_SIZE / CHUNK_RES;
        }

        async function rebuildAllPoC1() {
            const myEpoch = worldEpoch + 1;
            await initAsteroidChunks(sandbox.scene);
            if (worldEpoch !== myEpoch) return;
            const tunnelDir = new THREE.Vector3(0.14, 0.12, 1.0).normalize();
            const surfPt = findSurfacePoint(evalDensityPoC1, tunnelDir, currentRadius * 0.6, currentRadius * 1.4);
            const scaleFactor = currentRadius / 2800.0;
            await carveSpherePoC1(surfPt, 220 * scaleFactor);
            if (worldEpoch !== myEpoch) return;
            await carveSpherePoC1(surfPt.clone().addScaledVector(tunnelDir, -160 * scaleFactor), 200 * scaleFactor);
            if (worldEpoch !== myEpoch) return;
            await reinforceSpherePoC1(surfPt.clone().addScaledVector(tunnelDir, -150 * scaleFactor), 250 * scaleFactor);
        }

        // Initialize Shared Sandbox
        const sandbox = new PlanetaryBaseSandbox({
            pocId: 'poc1',
            pocTitle: 'Option 1: Chunked Surface Nets + Workers',
            defaultRadius: currentRadius,
            getCollisionMesh: () => activeChunkMeshes,
            getVisualMesh: () => activeChunkMeshes,
            getCellSize: () => `${CELL_SIZE.toFixed(1)}u (${CHUNK_RES}³)`,

            onCarve: async (hitPoint, hitNormal, brushRadius, mode) => {
                await carveSpherePoC1(hitPoint, brushRadius);
            },

            onReinforce: async (hitPoint, hitNormal, brushRadius) => {
                await reinforceSpherePoC1(hitPoint, brushRadius);
            },

            checkMaterialAtHit: (point, hit) => {
                if (hit && hit.face) {
                    const colAttr = hit.object.geometry.attributes.color;
                    if (colAttr) {
                        const a = hit.face.a;
                        if (colAttr.getY(a) > 0.8 && colAttr.getZ(a) > 0.9) {
                            return true;
                        }
                    }
                }
                return false;
            },

            onScaleChange: async (scaleKey, radius) => {
                currentRadius = radius;
                CELL_SIZE = (currentRadius * 0.45) / CHUNK_RES;
                await rebuildAllPoC1();
            },

            onQualityChange: async (qualityKey) => {
                applyQualityPoC1(qualityKey);
                await rebuildAllPoC1();
            },

            onToggleWireframe: (enabled) => {
                chunkMaterial.wireframe = enabled;
            },

            onToggleXRay: (enabled, plane) => {
                chunkMaterial.clippingPlanes = enabled ? [plane] : [];
                chunkMaterial.needsUpdate = true;
            }
        });

        function evalDensityPoC1(wx, wy, wz) {
            const dist = Math.sqrt(wx * wx + wy * wy + wz * wz);
            const freq = 0.0014 * (2800.0 / currentRadius);
            const n = (noise.fbm(wx * freq, wy * freq, wz * freq, 3) - 0.35) * (currentRadius * 0.24);
            return dist - (currentRadius + n);
        }

        // Initial Build + Starter Demonstration Tunnel & Reinforced Alcove
        currentRadius = sandbox.currentRadius;
        applyQualityPoC1(sandbox.currentQuality);
        sandbox.updateCellSizeLabel();
        rebuildAllPoC1();
    </script>
</body>
</html>
