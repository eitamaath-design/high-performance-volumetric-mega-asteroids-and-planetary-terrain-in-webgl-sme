<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 2: Adaptive QEF Dual Contouring SVO + Dirty AABB Patching</title>
    <style>
        body { margin: 0; overflow: hidden; background: #04060c; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from './vendor/three.module.js';
        import { PlanetaryBaseSandbox, createTriplanarAsteroidMaterial, findSurfacePoint, distPointToSegmentSq } from './shared/planetary_base_sandbox.js';
        import { MeshingWorkerPool } from './shared/meshing_worker_pool.js';
        import { ChunkBatchManager } from './shared/chunk_batch_manager.js';
        import { FastNoise3D } from './shared/deterministic_noise.js';

        const noise = new FastNoise3D(4242);

        const QUALITY_PRESETS_POC2 = { low: 10, medium: 14, high: 20, ultra: 26 };
        const FINE_CELL_LIMIT = 20.0;
        const MAX_SUBDIV_LEVEL = 4;
        let currentRadius = 2800;
        let LEAF_RES = 20; // Configurable by quality tier (10..26 interior cells per SVO leaf)
        let LEAF_SIZE = 1344;
        let CELL_SIZE = LEAF_SIZE / LEAF_RES;

        function computeFineCellSize(macroCell) {
            let c = macroCell;
            let lvl = 0;
            while (c > FINE_CELL_LIMIT && lvl < MAX_SUBDIV_LEVEL) {
                c *= 0.5;
                lvl++;
            }
            return c;
        }

        let FINE_CELL_SIZE = computeFineCellSize(CELL_SIZE);
        let worldEpoch = 0;

        const svoLeafMap = new Map();
        const editHistory = [];
        let opSerialChain = Promise.resolve();
        const _poc2CoarseGrid = new Float32Array(5 * 5 * 5);
        const _poc2SinOreX = new Float32Array(32);

        function collectLeaves() {
            const leaves = [];
            const stack = Array.from(svoLeafMap.values());
            while (stack.length > 0) {
                const node = stack.pop();
                if (!node) continue;
                if (node.children !== null) {
                    for (let i = 0; i < 8; i++) {
                        stack.push(node.children[i]);
                    }
                } else {
                    leaves.push(node);
                }
            }
            return leaves;
        }

        // Bounded ESM Worker Pool (2..4 workers, QEF Dual Contouring mode, epoch cancellation, crash recovery)
        const workerPool = new MeshingWorkerPool(new URL('workers/surface_nets_worker.js', window.location.href).href);
        window.__POC2_WORKER_POOL__ = workerPool;
        window.__POC2_LEAVES__ = svoLeafMap;
        window.__POC2_GET_LEAVES__ = () => collectLeaves();

        const leafMaterial = createTriplanarAsteroidMaterial({ vertexColors: true, useMatWeights: true, radius: currentRadius });
        const batchManager = new ChunkBatchManager(null, leafMaterial);
        window.__POC2_BATCH_MANAGER__ = batchManager;

        function enqueueSerializedOp(fn) {
            const capturedEpoch = worldEpoch;
            const next = opSerialChain.then(
                () => fn(capturedEpoch),
                () => fn(capturedEpoch)
            );
            opSerialChain = next.catch(() => {});
            return next;
        }

        function makeEditOp(type, hitPoint, brushRadius, mode = 'carve', prevHit = null) {
            const bx = hitPoint.x, by = hitPoint.y, bz = hitPoint.z;
            let hasCapsule = false;
            let ax = bx, ay = by, az = bz;
            if (prevHit) {
                const dx = bx - prevHit.x, dy = by - prevHit.y, dz = bz - prevHit.z;
                const segLenSq = dx * dx + dy * dy + dz * dz;
                const maxSweep = brushRadius * 4.0;
                if (segLenSq > 1e-4 && segLenSq <= maxSweep * maxSweep) {
                    hasCapsule = true;
                    ax = prevHit.x; ay = prevHit.y; az = prevHit.z;
                }
            }
            return {
                type,
                mode,
                x: bx, y: by, z: bz,
                ax, ay, az,
                hasCapsule,
                minX: hasCapsule ? Math.min(ax, bx) : bx,
                maxX: hasCapsule ? Math.max(ax, bx) : bx,
                minY: hasCapsule ? Math.min(ay, by) : by,
                maxY: hasCapsule ? Math.max(ay, by) : by,
                minZ: hasCapsule ? Math.min(az, bz) : bz,
                maxZ: hasCapsule ? Math.max(az, bz) : bz,
                radius: brushRadius
            };
        }

        function nodeIntersectsOp(node, op, r) {
            const halo = 2.0 * node.cellSize;
            const minX = node.minX - halo;
            const maxX = node.maxX + halo;
            const minY = node.minY - halo;
            const maxY = node.maxY + halo;
            const minZ = node.minZ - halo;
            const maxZ = node.maxZ + halo;
            if (!op.hasCapsule) {
                const dx = op.x < minX ? minX - op.x : (op.x > maxX ? op.x - maxX : 0);
                const dy = op.y < minY ? minY - op.y : (op.y > maxY ? op.y - maxY : 0);
                const dz = op.z < minZ ? minZ - op.z : (op.z > maxZ ? op.z - maxZ : 0);
                return (dx * dx + dy * dy + dz * dz) <= r * r;
            }
            return (
                op.maxX + r >= minX && op.minX - r <= maxX &&
                op.maxY + r >= minY && op.minY - r <= maxY &&
                op.maxZ + r >= minZ && op.minZ - r <= maxZ
            );
        }

        function nodeBoxIntersectsOp(node, op, r) {
            const minX = node.minX;
            const maxX = node.maxX;
            const minY = node.minY;
            const maxY = node.maxY;
            const minZ = node.minZ;
            const maxZ = node.maxZ;
            if (!op.hasCapsule) {
                const dx = op.x < minX ? minX - op.x : (op.x > maxX ? op.x - maxX : 0);
                const dy = op.y < minY ? minY - op.y : (op.y > maxY ? op.y - maxY : 0);
                const dz = op.z < minZ ? minZ - op.z : (op.z > maxZ ? op.z - maxZ : 0);
                return (dx * dx + dy * dy + dz * dz) <= r * r;
            }
            return (
                op.maxX + r >= minX && op.minX - r <= maxX &&
                op.maxY + r >= minY && op.minY - r <= maxY &&
                op.maxZ + r >= minZ && op.minZ - r <= maxZ
            );
        }

        function splitPad(node, opRadius) {
            return opRadius + Math.max(20.0, Math.min(node.cellSize * 0.55, FINE_CELL_SIZE * 2.0));
        }

        function findCoveringNode(gx, gy, gz, level) {
            const rx = gx >> level;
            const ry = gy >> level;
            const rz = gz >> level;
            let node = svoLeafMap.get(`0:${rx},${ry},${rz}`);
            if (!node) return null;
            for (let l = 0; l < level; l++) {
                if (!node.children) return node;
                const shift = level - 1 - l;
                const ox = (gx >> shift) & 1;
                const oy = (gy >> shift) & 1;
                const oz = (gz >> shift) & 1;
                node = node.children[ox + oy * 2 + oz * 4];
                if (!node) return null;
            }
            return node;
        }

        function computeDesiredExtendFlags(node) {
            const nx = findCoveringNode(node.lx + 1, node.ly, node.lz, node.level);
            const ny = findCoveringNode(node.lx, node.ly + 1, node.lz, node.level);
            const nz = findCoveringNode(node.lx, node.ly, node.lz + 1, node.level);
            return {
                x: Boolean(nx && nx.children !== null),
                y: Boolean(ny && ny.children !== null),
                z: Boolean(nz && nz.children !== null)
            };
        }

        class SVOLeafNode {
            constructor(lx, ly, lz, level = 0, size = LEAF_SIZE, epoch = worldEpoch, deferInit = false) {
                this.lx = lx;
                this.ly = ly;
                this.lz = lz;
                this.level = level;
                this.size = size;
                this.epoch = epoch;
                this.res = LEAF_RES;
                this.cellSize = size / this.res;
                this.key = `${level}:${lx},${ly},${lz}`;
                this.minX = lx * size;
                this.minY = ly * size;
                this.minZ = lz * size;
                this.maxX = this.minX + size;
                this.maxY = this.minY + size;
                this.maxZ = this.minZ + size;
                this.center = new THREE.Vector3(
                    this.minX + size * 0.5,
                    this.minY + size * 0.5,
                    this.minZ + size * 0.5
                );
                this.children = null;
                this.state = 'uninit'; // 'surface' | 'solid' | 'void'
                this.extendFlags = { x: false, y: false, z: false };
                this.hasMesh = false;
                this.hasArmor = false;
                this.isGenerating = false;
                this.needsRebuild = false;

                // 2-voxel halo padding on both sides: (LEAF_RES + 5)^3 samples for [1..LEAF_RES+2] cells
                const pRes = this.res + 5;
                this.pRes = pRes;
                this.pRes2 = pRes * pRes;
                this.density = null;
                this.material = null;

                if (!deferInit) {
                    this.initField();
                }
            }

            isDefinitelyVoid() {
                const pRes = this.pRes;
                const halfSpan = (pRes - 1) * this.cellSize * 0.5;
                const ccx = this.minX - 2.0 * this.cellSize + halfSpan;
                const ccy = this.minY - 2.0 * this.cellSize + halfSpan;
                const ccz = this.minZ - 2.0 * this.cellSize + halfSpan;
                const cDist = Math.sqrt(ccx * ccx + ccy * ccy + ccz * ccz);
                const halfDiag = halfSpan * 1.732051;
                return (cDist - halfDiag > currentRadius * 1.16);
            }

            initField() {
                const pRes = this.pRes;
                const pRes2 = this.pRes2;
                const minCrustR = currentRadius * 0.87;
                const maxCrustR = currentRadius * 1.16;
                const oreFreq = 0.007 * (2800.0 / currentRadius);

                const halfSpan = (pRes - 1) * this.cellSize * 0.5;
                const ccx = this.minX - 2.0 * this.cellSize + halfSpan;
                const ccy = this.minY - 2.0 * this.cellSize + halfSpan;
                const ccz = this.minZ - 2.0 * this.cellSize + halfSpan;
                const cDist = Math.sqrt(ccx * ccx + ccy * ccy + ccz * ccz);
                const halfDiag = halfSpan * 1.732051;

                if (cDist - halfDiag > maxCrustR) {
                    this.state = 'void';
                    this.density = null;
                    this.material = null;
                    return;
                }

                const touchesCrust = (cDist + halfDiag >= minCrustR) && (cDist - halfDiag <= maxCrustR);

                if (cDist + halfDiag < minCrustR) {
                    let hasEdit = false;
                    for (let i = 0; i < editHistory.length; i++) {
                        const op = editHistory[i];
                        if (nodeIntersectsOp(this, op, op.radius + this.cellSize * 2.5)) {
                            hasEdit = true;
                            break;
                        }
                    }
                    if (!hasEdit) {
                        this.state = 'solid';
                        this.density = null;
                        this.material = null;
                        return;
                    }
                }

                const useCoarseNoise = (this.level >= 1) && touchesCrust;
                const GRID = 5;
                const GRIDM1 = 4;
                const GRIDM2 = 3;
                const GRID2 = 25;
                const span = pRes - 1;
                if (useCoarseNoise) {
                    let gIdx = 0;
                    let minOff = Infinity;
                    let maxOff = -Infinity;
                    const invGM1 = 0.25;
                    for (let gz = 0; gz < GRID; gz++) {
                        const wz = this.minZ + ((gz * invGM1) * span - 2) * this.cellSize;
                        for (let gy = 0; gy < GRID; gy++) {
                            const wy = this.minY + ((gy * invGM1) * span - 2) * this.cellSize;
                            for (let gx = 0; gx < GRID; gx++) {
                                const wx = this.minX + ((gx * invGM1) * span - 2) * this.cellSize;
                                const nVal = evalNoiseOffsetPoC2(wx, wy, wz);
                                _poc2CoarseGrid[gIdx++] = nVal;
                                if (nVal < minOff) minOff = nVal;
                                if (nVal > maxOff) maxOff = nVal;
                            }
                        }
                    }
                    const slack = this.level >= 2 ? 20.0 : 45.0;
                    if (cDist - halfDiag > currentRadius + maxOff + slack) {
                        this.state = 'void';
                        this.density = null;
                        this.material = null;
                        return;
                    }
                    if (cDist + halfDiag < currentRadius + minOff - slack) {
                        let hasEdit = false;
                        for (let i = 0; i < editHistory.length; i++) {
                            const op = editHistory[i];
                            if (nodeIntersectsOp(this, op, op.radius + this.cellSize * 2.5)) {
                                hasEdit = true;
                                break;
                            }
                        }
                        if (!hasEdit) {
                            this.state = 'solid';
                            this.density = null;
                            this.material = null;
                            return;
                        }
                    }
                }

                const totalSamples = pRes * pRes * pRes;
                this.density = new Float32Array(totalSamples);
                this.material = new Uint8Array(totalSamples);
                this.material.fill(1);

                for (let px = 0; px < pRes; px++) {
                    _poc2SinOreX[px] = Math.sin((this.minX + (px - 2) * this.cellSize) * oreFreq);
                }

                const invSpanG = GRIDM1 / span;
                let idx = 0;
                for (let pz = 0; pz < pRes; pz++) {
                    const wz = this.minZ + (pz - 2) * this.cellSize;
                    const wz2 = wz * wz;
                    let iz0 = 0, tz = 0.0;
                    if (useCoarseNoise) {
                        const fz = pz * invSpanG;
                        iz0 = Math.min(GRIDM2, Math.floor(fz));
                        tz = fz - iz0;
                    }
                    for (let py = 0; py < pRes; py++) {
                        const wy = this.minY + (py - 2) * this.cellSize;
                        const wyz2 = wz2 + wy * wy;
                        const cosOreY = Math.cos(wy * oreFreq);
                        const checkOreY = Math.abs(cosOreY) > 0.78;
                        let iy0 = 0, ty = 0.0;
                        if (useCoarseNoise) {
                            const fy = py * invSpanG;
                            iy0 = Math.min(GRIDM2, Math.floor(fy));
                            ty = fy - iy0;
                        }
                        for (let px = 0; px < pRes; px++) {
                            const wx = this.minX + (px - 2) * this.cellSize;
                            const rDist = Math.sqrt(wyz2 + wx * wx);
                            let d;
                            if (!touchesCrust || rDist < minCrustR || rDist > maxCrustR) {
                                d = rDist - currentRadius;
                            } else if (useCoarseNoise) {
                                const fx = px * invSpanG;
                                const ix0 = Math.min(GRIDM2, Math.floor(fx));
                                const tx = fx - ix0;
                                const base = ix0 + iy0 * GRID + iz0 * GRID2;
                                const c000 = _poc2CoarseGrid[base];
                                const c100 = _poc2CoarseGrid[base + 1];
                                const c010 = _poc2CoarseGrid[base + GRID];
                                const c110 = _poc2CoarseGrid[base + GRID + 1];
                                const c001 = _poc2CoarseGrid[base + GRID2];
                                const c101 = _poc2CoarseGrid[base + GRID2 + 1];
                                const c011 = _poc2CoarseGrid[base + GRID2 + GRID];
                                const c111 = _poc2CoarseGrid[base + GRID2 + GRID + 1];
                                const x00 = c000 + (c100 - c000) * tx;
                                const x10 = c010 + (c110 - c010) * tx;
                                const x01 = c001 + (c101 - c001) * tx;
                                const x11 = c011 + (c111 - c011) * tx;
                                const y0 = x00 + (x10 - x00) * ty;
                                const y1 = x01 + (x11 - x01) * ty;
                                const nOff = y0 + (y1 - y0) * tz;
                                d = rDist - (currentRadius + nOff);
                            } else {
                                d = evalDensityPoC2(wx, wy, wz);
                            }
                            this.density[idx] = d;
                            if (checkOreY && d < -this.cellSize && _poc2SinOreX[px] * cosOreY > 0.78) {
                                this.material[idx] = 2;
                            }
                            idx++;
                        }
                    }
                }

                // Replay intersecting editHistory ops chronologically within clamped leaf AABBs
                const invCell = 1.0 / this.cellSize;
                for (let eIdx = 0; eIdx < editHistory.length; eIdx++) {
                    const op = editHistory[eIdx];
                    if (op.type === 'carve') {
                        const pad = op.radius + this.cellSize * 2.5;
                        const padSq = pad * pad;
                        const breachPad = op.radius + this.cellSize * 1.5;
                        const breachSq = breachPad * breachPad;
                        const isBreach = op.mode === 'breach';
                        const minPX = Math.max(0, Math.floor((op.minX - pad - this.minX) * invCell + 2));
                        const maxPX = Math.min(pRes - 1, Math.ceil((op.maxX + pad - this.minX) * invCell + 2));
                        const minPY = Math.max(0, Math.floor((op.minY - pad - this.minY) * invCell + 2));
                        const maxPY = Math.min(pRes - 1, Math.ceil((op.maxY + pad - this.minY) * invCell + 2));
                        const minPZ = Math.max(0, Math.floor((op.minZ - pad - this.minZ) * invCell + 2));
                        const maxPZ = Math.min(pRes - 1, Math.ceil((op.maxZ + pad - this.minZ) * invCell + 2));
                        if (minPX > maxPX || minPY > maxPY || minPZ > maxPZ) continue;
                        for (let z = minPZ; z <= maxPZ; z++) {
                            const wz = this.minZ + (z - 2) * this.cellSize;
                            const dz = wz - op.z;
                            const zOff = z * pRes2;
                            for (let y = minPY; y <= maxPY; y++) {
                                const wy = this.minY + (y - 2) * this.cellSize;
                                const dy = wy - op.y;
                                const yzOff = zOff + y * pRes;
                                for (let x = minPX; x <= maxPX; x++) {
                                    const wx = this.minX + (x - 2) * this.cellSize;
                                    const dSq = op.hasCapsule
                                        ? distPointToSegmentSq(wx, wy, wz, op.ax, op.ay, op.az, op.x, op.y, op.z)
                                        : ((wx - op.x) * (wx - op.x) + dy * dy + dz * dz);
                                    if (dSq <= padSq) {
                                        const dIdx = yzOff + x;
                                        if (isBreach && dSq <= breachSq && this.material[dIdx] === 3) {
                                            this.material[dIdx] = 1;
                                        }
                                        const carveD = op.radius - Math.sqrt(dSq);
                                        if (carveD > this.density[dIdx]) {
                                            this.density[dIdx] = carveD;
                                        }
                                    }
                                }
                            }
                        }
                    } else if (op.type === 'reinforce') {
                        const rSq = op.radius * op.radius;
                        const minPX = Math.max(0, Math.floor((op.minX - op.radius - this.minX) * invCell + 2));
                        const maxPX = Math.min(pRes - 1, Math.ceil((op.maxX + op.radius - this.minX) * invCell + 2));
                        const minPY = Math.max(0, Math.floor((op.minY - op.radius - this.minY) * invCell + 2));
                        const maxPY = Math.min(pRes - 1, Math.ceil((op.maxY + op.radius - this.minY) * invCell + 2));
                        const minPZ = Math.max(0, Math.floor((op.minZ - op.radius - this.minZ) * invCell + 2));
                        const maxPZ = Math.min(pRes - 1, Math.ceil((op.maxZ + op.radius - this.minZ) * invCell + 2));
                        if (minPX > maxPX || minPY > maxPY || minPZ > maxPZ) continue;
                        for (let z = minPZ; z <= maxPZ; z++) {
                            const wz = this.minZ + (z - 2) * this.cellSize;
                            const dz = wz - op.z;
                            const zOff = z * pRes2;
                            for (let y = minPY; y <= maxPY; y++) {
                                const wy = this.minY + (y - 2) * this.cellSize;
                                const dy = wy - op.y;
                                const yzOff = zOff + y * pRes;
                                for (let x = minPX; x <= maxPX; x++) {
                                    const wx = this.minX + (x - 2) * this.cellSize;
                                    const dSq = op.hasCapsule
                                        ? distPointToSegmentSq(wx, wy, wz, op.ax, op.ay, op.az, op.x, op.y, op.z)
                                        : ((wx - op.x) * (wx - op.x) + dy * dy + dz * dz);
                                    const dIdx = yzOff + x;
                                    if (dSq <= rSq && this.density[dIdx] < 0.0) {
                                        this.material[dIdx] = 3;
                                        this.hasArmor = true;
                                    }
                                }
                            }
                        }
                    }
                }

                let hasNeg = false;
                let hasPos = false;
                for (let k = 0; k < totalSamples; k++) {
                    if (this.density[k] < 0.0) hasNeg = true;
                    else hasPos = true;
                    if (hasNeg && hasPos) break;
                }
                if (hasNeg && hasPos) {
                    this.state = 'surface';
                } else {
                    this.state = hasNeg ? 'solid' : 'void';
                    this.density = null;
                    this.material = null;
                }
            }

            getD(x, y, z) {
                return this.density[x + y * this.pRes + z * this.pRes2];
            }

            getMat(x, y, z) {
                return this.material[x + y * this.pRes + z * this.pRes2];
            }

            applyMeshResult(scene, result, options = {}) {
                if (this.children !== null || this.epoch !== worldEpoch || !result || result.cancelled) {
                    return;
                }
                const deferFlush = Boolean(options && options.deferFlush);
                const { positions, normals, colors, matWeights, indices } = result;
                if (!positions || !indices || positions.length === 0 || indices.length === 0) {
                    if (this.hasMesh) {
                        batchManager.removeChunk(this.key);
                        this.hasMesh = false;
                    }
                    if (this.density && !this.hasArmor) {
                        let hasNeg = false;
                        const dArr = this.density;
                        for (let i = 0; i < dArr.length; i++) {
                            if (dArr[i] < 0.0) {
                                hasNeg = true;
                                break;
                            }
                        }
                        if (!hasNeg) {
                            this.state = 'void';
                            this.density = null;
                            this.material = null;
                        }
                    }
                    if (!deferFlush) batchManager.flush(scene);
                    return;
                }

                batchManager.upsertChunk(this.key, this.center, positions, normals, colors, indices, matWeights);
                this.hasMesh = true;
                if (!deferFlush) batchManager.flush(scene);
            }

            // Adaptive QEF Dual Contouring offloaded to unified MeshingWorkerPool (mode: 'dual_contour')
            async rebuildMesh(scene, options = {}) {
                const deferSwap = Boolean(options && options.deferSwap);
                if (this.children !== null || this.epoch !== worldEpoch || this.state !== 'surface' || !this.density) {
                    this.needsRebuild = false;
                    if (this.children === null && this.epoch === worldEpoch && this.hasMesh && !deferSwap) {
                        batchManager.removeChunk(this.key);
                        this.hasMesh = false;
                        if (!(options && options.deferFlush)) batchManager.flush(scene);
                    }
                    return { cancelled: true };
                }
                if (this.isGenerating) {
                    this.needsRebuild = true;
                    return null;
                }
                this.isGenerating = true;
                this.needsRebuild = false;

                let result = null;
                let failed = false;
                try {
                    result = await workerPool.enqueue({
                        epoch: this.epoch,
                        buildPayload: () => {
                            if (!this.density || !this.material || this.children !== null) {
                                return {
                                    payload: {
                                        mode: 'dual_contour',
                                        chunkId: this.key,
                                        res: this.res,
                                        voxelData: new Float32Array(0),
                                        materialData: new Uint8Array(0),
                                        minBounds: [this.minX, this.minY, this.minZ],
                                        cellSize: this.cellSize,
                                        extendPosX: false,
                                        extendPosY: false,
                                        extendPosZ: false
                                    },
                                    transferables: []
                                };
                            }
                            const voxelCopy = new Float32Array(this.density);
                            const matCopy = new Uint8Array(this.material);
                            return {
                                payload: {
                                    mode: 'dual_contour',
                                    chunkId: this.key,
                                    res: this.res,
                                    voxelData: voxelCopy,
                                    materialData: matCopy,
                                    minBounds: [this.minX, this.minY, this.minZ],
                                    cellSize: this.cellSize,
                                    extendPosX: this.extendFlags.x,
                                    extendPosY: this.extendFlags.y,
                                    extendPosZ: this.extendFlags.z
                                },
                                transferables: [voxelCopy.buffer, matCopy.buffer]
                            };
                        }
                    });
                } catch (err) {
                    failed = true;
                    console.warn(`[PoC2] Leaf ${this.key} QEF meshing failed:`, err);
                } finally {
                    this.isGenerating = false;
                }

                if (failed || !result || result.cancelled || this.children !== null || this.epoch !== worldEpoch) {
                    this.needsRebuild = false;
                    return result || { cancelled: true };
                }

                if (deferSwap) {
                    return { leaf: this, result };
                }

                this.applyMeshResult(scene, result, options);

                if (this.needsRebuild && this.epoch === worldEpoch && this.children === null) {
                    return await this.rebuildMesh(scene, options);
                }
                return result;
            }
        }

        function evalNoiseOffsetPoC2(wx, wy, wz) {
            const freq = 0.0015 * (2800.0 / currentRadius);
            return (noise.fbm(wx * freq, wy * freq, wz * freq, 3) - 0.35) * (currentRadius * 0.22);
        }

        function evalDensityPoC2(wx, wy, wz) {
            const dist = Math.sqrt(wx * wx + wy * wy + wz * wz);
            return dist - (currentRadius + evalNoiseOffsetPoC2(wx, wy, wz));
        }

        async function initSVO(scene) {
            worldEpoch++;
            workerPool.setEpoch(worldEpoch);
            opSerialChain = Promise.resolve();
            editHistory.length = 0;
            batchManager.setScene(scene);
            batchManager.clear();
            svoLeafMap.clear();

            LEAF_SIZE = currentRadius * 0.48;
            CELL_SIZE = LEAF_SIZE / LEAF_RES;
            FINE_CELL_SIZE = computeFineCellSize(CELL_SIZE);
            leafMaterial.userData.shaderUniforms.uAsteroidRadius.value = currentRadius;

            const bound = Math.ceil((currentRadius * 1.25) / LEAF_SIZE);
            const halfDiag = LEAF_SIZE * 0.92;
            const minShellR = currentRadius * 0.72;
            const maxShellR = currentRadius * 1.22;

            const initialRebuilds = [];
            for (let lz = -bound; lz <= bound; lz++) {
                for (let ly = -bound; ly <= bound; ly++) {
                    for (let lx = -bound; lx <= bound; lx++) {
                        const centerX = (lx + 0.5) * LEAF_SIZE;
                        const centerY = (ly + 0.5) * LEAF_SIZE;
                        const centerZ = (lz + 0.5) * LEAF_SIZE;
                        const dist = Math.sqrt(centerX * centerX + centerY * centerY + centerZ * centerZ);
                        if (dist < maxShellR + halfDiag && dist > minShellR - halfDiag) {
                            const leaf = new SVOLeafNode(lx, ly, lz, 0, LEAF_SIZE, worldEpoch);
                            if (leaf.state !== 'void') {
                                svoLeafMap.set(leaf.key, leaf);
                                if (leaf.state === 'surface') {
                                    initialRebuilds.push(leaf.rebuildMesh(scene, { deferFlush: true }));
                                }
                            }
                        }
                    }
                }
            }
            await Promise.allSettled(initialRebuilds);
            batchManager.flush(scene);
        }

        function splitLeafNode(node, op, retiredKeys, splitNodes, newLeaves) {
            if (node.hasMesh) {
                retiredKeys.push(node.key);
                node.hasMesh = false;
            }
            node.needsRebuild = false;
            node.density = null;
            node.material = null;
            node.children = new Array(8);
            splitNodes.push(node);

            const halfSize = node.size * 0.5;
            const childLevel = node.level + 1;
            let cIdx = 0;
            for (let oz = 0; oz < 2; oz++) {
                for (let oy = 0; oy < 2; oy++) {
                    for (let ox = 0; ox < 2; ox++) {
                        const child = new SVOLeafNode(
                            node.lx * 2 + ox,
                            node.ly * 2 + oy,
                            node.lz * 2 + oz,
                            childLevel,
                            halfSize,
                            node.epoch,
                            true
                        );
                        node.children[cIdx++] = child;
                        if (child.isDefinitelyVoid()) {
                            child.state = 'void';
                            newLeaves.push(child);
                        } else if (
                            child.cellSize > FINE_CELL_LIMIT &&
                            child.level < MAX_SUBDIV_LEVEL &&
                            nodeBoxIntersectsOp(child, op, splitPad(child, op.radius))
                        ) {
                            splitLeafNode(child, op, retiredKeys, splitNodes, newLeaves);
                        } else {
                            child.initField();
                            newLeaves.push(child);
                        }
                    }
                }
            }
        }

        function updateNeighborExtendFlags(splitNodes, newLeafSet, recontourLeaves) {
            const checkedNeighbors = new Set();
            for (let i = 0; i < splitNodes.length; i++) {
                const p = splitNodes[i];
                const dirs = [
                    [p.lx - 1, p.ly, p.lz],
                    [p.lx, p.ly - 1, p.lz],
                    [p.lx, p.ly, p.lz - 1]
                ];
                for (let d = 0; d < 3; d++) {
                    const nb = findCoveringNode(dirs[d][0], dirs[d][1], dirs[d][2], p.level);
                    if (!nb || nb.children !== null || nb.state !== 'surface' || newLeafSet.has(nb) || checkedNeighbors.has(nb)) {
                        continue;
                    }
                    checkedNeighbors.add(nb);
                    const desired = computeDesiredExtendFlags(nb);
                    if (
                        desired.x !== nb.extendFlags.x ||
                        desired.y !== nb.extendFlags.y ||
                        desired.z !== nb.extendFlags.z
                    ) {
                        nb.extendFlags = desired;
                        recontourLeaves.add(nb);
                    }
                }
            }
        }

        async function carveSpherePoC2(hitPoint, brushRadius, mode = 'carve', prevHit = null) {
            return enqueueSerializedOp(async (opEpoch) => {
                if (opEpoch !== worldEpoch) {
                    return { mainThreadMs: 0, cancelled: true };
                }
                const syncStart = performance.now();
                const op = makeEditOp('carve', hitPoint, brushRadius, mode, prevHit);
                editHistory.push(op);

                const effPad = brushRadius + Math.max(45.0, CELL_SIZE * 3.5);
                const minLX = Math.floor((op.minX - effPad) / LEAF_SIZE);
                const maxLX = Math.floor((op.maxX + effPad) / LEAF_SIZE);
                const minLY = Math.floor((op.minY - effPad) / LEAF_SIZE);
                const maxLY = Math.floor((op.maxY + effPad) / LEAF_SIZE);
                const minLZ = Math.floor((op.minZ - effPad) / LEAF_SIZE);
                const maxLZ = Math.floor((op.maxZ + effPad) / LEAF_SIZE);

                const retiredKeys = [];
                const splitNodes = [];
                const newLeaves = [];
                const recontourLeaves = new Set();

                function visitForCarve(node, isNewlyCreatedRoot) {
                    const reachPad = Math.max(op.radius + node.cellSize * 2.5, splitPad(node, op.radius));
                    if (!nodeIntersectsOp(node, op, reachPad)) return;

                    if (node.children !== null) {
                        for (let i = 0; i < 8; i++) {
                            visitForCarve(node.children[i], false);
                        }
                        return;
                    }

                    if (node.state === 'void') return;

                    if (
                        node.cellSize > FINE_CELL_LIMIT &&
                        node.level < MAX_SUBDIV_LEVEL &&
                        nodeBoxIntersectsOp(node, op, splitPad(node, op.radius))
                    ) {
                        splitLeafNode(node, op, retiredKeys, splitNodes, newLeaves);
                        return;
                    }

                    if (!nodeIntersectsOp(node, op, op.radius + node.cellSize * 2.5)) {
                        if (isNewlyCreatedRoot && node.state === 'surface') {
                            recontourLeaves.add(node);
                        }
                        return;
                    }

                    if (isNewlyCreatedRoot) {
                        if (node.state === 'surface') {
                            recontourLeaves.add(node);
                        }
                        return;
                    }

                    if (node.state === 'solid' || !node.density) {
                        node.initField();
                        if (node.state === 'surface') {
                            recontourLeaves.add(node);
                        }
                        return;
                    }

                    // Incremental clamped-AABB carve on existing fine 'surface' leaf
                    const pRes = node.pRes;
                    const pRes2 = node.pRes2;
                    const leafPad = op.radius + node.cellSize * 2.5;
                    const leafPadSq = leafPad * leafPad;
                    const breachPad = op.radius + node.cellSize * 1.5;
                    const breachSq = breachPad * breachPad;
                    const isBreach = op.mode === 'breach';
                    const invCell = 1.0 / node.cellSize;
                    const minPX = Math.max(0, Math.floor((op.minX - leafPad - node.minX) * invCell + 2));
                    const maxPX = Math.min(pRes - 1, Math.ceil((op.maxX + leafPad - node.minX) * invCell + 2));
                    const minPY = Math.max(0, Math.floor((op.minY - leafPad - node.minY) * invCell + 2));
                    const maxPY = Math.min(pRes - 1, Math.ceil((op.maxY + leafPad - node.minY) * invCell + 2));
                    const minPZ = Math.max(0, Math.floor((op.minZ - leafPad - node.minZ) * invCell + 2));
                    const maxPZ = Math.min(pRes - 1, Math.ceil((op.maxZ + leafPad - node.minZ) * invCell + 2));
                    if (minPX > maxPX || minPY > maxPY || minPZ > maxPZ) return;

                    let modified = false;
                    for (let z = minPZ; z <= maxPZ; z++) {
                        const wz = node.minZ + (z - 2) * node.cellSize;
                        const dz = wz - op.z;
                        const zOff = z * pRes2;
                        for (let y = minPY; y <= maxPY; y++) {
                            const wy = node.minY + (y - 2) * node.cellSize;
                            const dy = wy - op.y;
                            const yzOff = zOff + y * pRes;
                            for (let x = minPX; x <= maxPX; x++) {
                                const wx = node.minX + (x - 2) * node.cellSize;
                                const dSq = op.hasCapsule
                                    ? distPointToSegmentSq(wx, wy, wz, op.ax, op.ay, op.az, op.x, op.y, op.z)
                                    : ((wx - op.x) * (wx - op.x) + dy * dy + dz * dz);
                                if (dSq <= leafPadSq) {
                                    const idx = yzOff + x;
                                    if (isBreach && dSq <= breachSq && node.material[idx] === 3) {
                                        node.material[idx] = 1;
                                        modified = true;
                                    }
                                    const carveD = op.radius - Math.sqrt(dSq);
                                    if (carveD > node.density[idx]) {
                                        node.density[idx] = carveD;
                                        modified = true;
                                    }
                                }
                            }
                        }
                    }
                    if (modified) {
                        recontourLeaves.add(node);
                    }
                }

                for (let lz = minLZ; lz <= maxLZ; lz++) {
                    for (let ly = minLY; ly <= maxLY; ly++) {
                        for (let lx = minLX; lx <= maxLX; lx++) {
                            const key = `0:${lx},${ly},${lz}`;
                            let root = svoLeafMap.get(key);
                            let isNewRoot = false;
                            if (!root) {
                                root = new SVOLeafNode(lx, ly, lz, 0, LEAF_SIZE, worldEpoch, true);
                                if (root.isDefinitelyVoid()) continue;
                                if (
                                    root.cellSize > FINE_CELL_LIMIT &&
                                    root.level < MAX_SUBDIV_LEVEL &&
                                    nodeBoxIntersectsOp(root, op, splitPad(root, op.radius))
                                ) {
                                    svoLeafMap.set(key, root);
                                    splitLeafNode(root, op, retiredKeys, splitNodes, newLeaves);
                                    continue;
                                }
                                root.initField();
                                if (root.state === 'void') continue;
                                svoLeafMap.set(key, root);
                                isNewRoot = true;
                            }
                            visitForCarve(root, isNewRoot);
                        }
                    }
                }

                const newLeafSet = new Set(newLeaves);
                for (let i = 0; i < newLeaves.length; i++) {
                    const nl = newLeaves[i];
                    if (nl.state === 'surface') {
                        nl.extendFlags = computeDesiredExtendFlags(nl);
                        recontourLeaves.add(nl);
                    }
                }
                if (splitNodes.length > 0) {
                    updateNeighborExtendFlags(splitNodes, newLeafSet, recontourLeaves);
                }

                const deferredRebuilds = [];
                for (const leaf of recontourLeaves) {
                    if (leaf.children === null && leaf.state === 'surface') {
                        deferredRebuilds.push(leaf.rebuildMesh(sandbox.scene, { deferSwap: true }));
                    }
                }

                const mainThreadMs = performance.now() - syncStart;
                const settled = await Promise.allSettled(deferredRebuilds);
                if (opEpoch !== worldEpoch) {
                    return { mainThreadMs, cancelled: true };
                }

                for (let i = 0; i < retiredKeys.length; i++) {
                    batchManager.removeChunk(retiredKeys[i]);
                }
                for (let i = 0; i < settled.length; i++) {
                    const entry = settled[i];
                    if (entry.status === 'fulfilled' && entry.value && entry.value.leaf && entry.value.result) {
                        entry.value.leaf.applyMeshResult(sandbox.scene, entry.value.result, { deferFlush: true });
                    }
                }
                batchManager.flush(sandbox.scene);
                return { mainThreadMs };
            });
        }

        async function reinforceSpherePoC2(hitPoint, brushRadius, prevHit = null) {
            return enqueueSerializedOp(async (opEpoch) => {
                if (opEpoch !== worldEpoch) {
                    return { mainThreadMs: 0, cancelled: true };
                }
                const syncStart = performance.now();
                const op = makeEditOp('reinforce', hitPoint, brushRadius, 'reinforce', prevHit);
                editHistory.push(op);

                const effPad = brushRadius + Math.max(45.0, CELL_SIZE * 3.5);
                const minLX = Math.floor((op.minX - effPad) / LEAF_SIZE);
                const maxLX = Math.floor((op.maxX + effPad) / LEAF_SIZE);
                const minLY = Math.floor((op.minY - effPad) / LEAF_SIZE);
                const maxLY = Math.floor((op.maxY + effPad) / LEAF_SIZE);
                const minLZ = Math.floor((op.minZ - effPad) / LEAF_SIZE);
                const maxLZ = Math.floor((op.maxZ + effPad) / LEAF_SIZE);

                const retiredKeys = [];
                const splitNodes = [];
                const newLeaves = [];
                const recontourLeaves = new Set();

                function visitForReinforce(node) {
                    const reachPad = Math.max(op.radius + node.cellSize * 2.0, splitPad(node, op.radius));
                    if (!nodeIntersectsOp(node, op, reachPad)) return;

                    if (node.children !== null) {
                        for (let i = 0; i < 8; i++) {
                            visitForReinforce(node.children[i]);
                        }
                        return;
                    }

                    if (node.state !== 'surface' || !node.density) return;

                    if (
                        node.cellSize > FINE_CELL_LIMIT &&
                        node.level < MAX_SUBDIV_LEVEL &&
                        node.hasMesh &&
                        nodeBoxIntersectsOp(node, op, splitPad(node, op.radius))
                    ) {
                        splitLeafNode(node, op, retiredKeys, splitNodes, newLeaves);
                        return;
                    }

                    const pRes = node.pRes;
                    const pRes2 = node.pRes2;
                    const invCell = 1.0 / node.cellSize;
                    const rSq = op.radius * op.radius;
                    const minPX = Math.max(0, Math.floor((op.minX - op.radius - node.minX) * invCell + 2));
                    const maxPX = Math.min(pRes - 1, Math.ceil((op.maxX + op.radius - node.minX) * invCell + 2));
                    const minPY = Math.max(0, Math.floor((op.minY - op.radius - node.minY) * invCell + 2));
                    const maxPY = Math.min(pRes - 1, Math.ceil((op.maxY + op.radius - node.minY) * invCell + 2));
                    const minPZ = Math.max(0, Math.floor((op.minZ - op.radius - node.minZ) * invCell + 2));
                    const maxPZ = Math.min(pRes - 1, Math.ceil((op.maxZ + op.radius - node.minZ) * invCell + 2));
                    if (minPX > maxPX || minPY > maxPY || minPZ > maxPZ) return;

                    let modified = false;
                    for (let z = minPZ; z <= maxPZ; z++) {
                        const wz = node.minZ + (z - 2) * node.cellSize;
                        const dz = wz - op.z;
                        const zOff = z * pRes2;
                        for (let y = minPY; y <= maxPY; y++) {
                            const wy = node.minY + (y - 2) * node.cellSize;
                            const dy = wy - op.y;
                            const yzOff = zOff + y * pRes;
                            for (let x = minPX; x <= maxPX; x++) {
                                const wx = node.minX + (x - 2) * node.cellSize;
                                const dSq = op.hasCapsule
                                    ? distPointToSegmentSq(wx, wy, wz, op.ax, op.ay, op.az, op.x, op.y, op.z)
                                    : ((wx - op.x) * (wx - op.x) + dy * dy + dz * dz);
                                const idx = yzOff + x;
                                if (dSq <= rSq && node.density[idx] < 0.0) {
                                    node.material[idx] = 3; // Reinforced Titanium Bulkhead
                                    node.hasArmor = true;
                                    modified = true;
                                }
                            }
                        }
                    }
                    if (modified) {
                        recontourLeaves.add(node);
                    }
                }

                for (let lz = minLZ; lz <= maxLZ; lz++) {
                    for (let ly = minLY; ly <= maxLY; ly++) {
                        for (let lx = minLX; lx <= maxLX; lx++) {
                            const root = svoLeafMap.get(`0:${lx},${ly},${lz}`);
                            if (root) visitForReinforce(root);
                        }
                    }
                }

                const newLeafSet = new Set(newLeaves);
                for (let i = 0; i < newLeaves.length; i++) {
                    const nl = newLeaves[i];
                    if (nl.state === 'surface') {
                        nl.extendFlags = computeDesiredExtendFlags(nl);
                        recontourLeaves.add(nl);
                    }
                }
                if (splitNodes.length > 0) {
                    updateNeighborExtendFlags(splitNodes, newLeafSet, recontourLeaves);
                }

                const deferredRebuilds = [];
                for (const leaf of recontourLeaves) {
                    if (leaf.children === null && leaf.state === 'surface') {
                        deferredRebuilds.push(leaf.rebuildMesh(sandbox.scene, { deferSwap: true }));
                    }
                }

                const mainThreadMs = performance.now() - syncStart;
                const settled = await Promise.allSettled(deferredRebuilds);
                if (opEpoch !== worldEpoch) {
                    return { mainThreadMs, cancelled: true };
                }

                for (let i = 0; i < retiredKeys.length; i++) {
                    batchManager.removeChunk(retiredKeys[i]);
                }
                for (let i = 0; i < settled.length; i++) {
                    const entry = settled[i];
                    if (entry.status === 'fulfilled' && entry.value && entry.value.leaf && entry.value.result) {
                        entry.value.leaf.applyMeshResult(sandbox.scene, entry.value.result, { deferFlush: true });
                    }
                }
                batchManager.flush(sandbox.scene);
                return { mainThreadMs };
            });
        }

        function applyQualityPoC2(qualityKey) {
            LEAF_RES = QUALITY_PRESETS_POC2[qualityKey] || 20;
            LEAF_SIZE = currentRadius * 0.48;
            CELL_SIZE = LEAF_SIZE / LEAF_RES;
            FINE_CELL_SIZE = computeFineCellSize(CELL_SIZE);
        }

        async function rebuildAllPoC2() {
            const myEpoch = worldEpoch + 1;
            await initSVO(sandbox.scene);
            if (worldEpoch !== myEpoch) return;
            const tunnelDir = new THREE.Vector3(0.14, 0.12, 1.0).normalize();
            const surfPt = findSurfacePoint(evalDensityPoC2, tunnelDir, currentRadius * 0.6, currentRadius * 1.4);
            await carveSpherePoC2(surfPt, 200);
            if (worldEpoch !== myEpoch) return;
            await carveSpherePoC2(surfPt.clone().addScaledVector(tunnelDir, -150), 180);
            if (worldEpoch !== myEpoch) return;
            await reinforceSpherePoC2(surfPt.clone().addScaledVector(tunnelDir, -140), 220);
            if (worldEpoch === myEpoch && typeof sandbox !== 'undefined' && sandbox) {
                sandbox.updateCellSizeLabel();
            }
        }

        // Shared Sandbox Setup
        const sandbox = new PlanetaryBaseSandbox({
            pocId: 'poc2',
            pocTitle: 'Option 2: QEF Dual Contouring SVO',
            defaultRadius: currentRadius,
            getCollisionMesh: () => batchManager.getBatchedMeshes(),
            getVisualMesh: () => batchManager.getBatchedMeshes(),
            getCellSize: () => {
                const leaves = collectLeaves();
                let activeMinCell = CELL_SIZE;
                for (let i = 0; i < leaves.length; i++) {
                    const l = leaves[i];
                    if ((l.state === 'surface' || l.hasMesh) && l.cellSize < activeMinCell) {
                        activeMinCell = l.cellSize;
                    }
                }
                if (activeMinCell < CELL_SIZE - 0.05) {
                    return `${activeMinCell.toFixed(1)}u fine / ${CELL_SIZE.toFixed(1)}u macro (${LEAF_RES}³)`;
                }
                return `${CELL_SIZE.toFixed(1)}u (${LEAF_RES}³)`;
            },

            onCarve: async (hitPoint, hitNormal, brushRadius, mode, prevHit = null) => {
                return await carveSpherePoC2(hitPoint, brushRadius, mode, prevHit);
            },

            onReinforce: async (hitPoint, hitNormal, brushRadius, prevHit = null) => {
                return await reinforceSpherePoC2(hitPoint, brushRadius, prevHit);
            },

            checkMaterialAtHit: (point, hit) => {
                if (hit && hit.face && hit.object && hit.object.geometry) {
                    const mwAttr = hit.object.geometry.attributes.aMatWeights;
                    if (mwAttr) {
                        const avgArmor = (mwAttr.getZ(hit.face.a) + mwAttr.getZ(hit.face.b) + mwAttr.getZ(hit.face.c)) / 3.0;
                        return avgArmor >= 0.35;
                    }
                }
                return false;
            },

            onScaleChange: async (scaleKey, radius) => {
                currentRadius = radius;
                LEAF_SIZE = currentRadius * 0.48;
                CELL_SIZE = LEAF_SIZE / LEAF_RES;
                FINE_CELL_SIZE = computeFineCellSize(CELL_SIZE);
                await rebuildAllPoC2();
            },

            onQualityChange: async (qualityKey) => {
                applyQualityPoC2(qualityKey);
                await rebuildAllPoC2();
            },

            onToggleWireframe: (enabled) => {
                leafMaterial.wireframe = enabled;
            },

            onToggleXRay: (enabled, plane) => {
                leafMaterial.clippingPlanes = enabled ? [plane] : [];
                const targetSide = enabled ? THREE.DoubleSide : THREE.FrontSide;
                if (leafMaterial.side !== targetSide) {
                    leafMaterial.side = targetSide;
                }
                leafMaterial.needsUpdate = true;
            }
        });
        batchManager.setScene(sandbox.scene);

        currentRadius = sandbox.currentRadius;
        applyQualityPoC2(sandbox.currentQuality);
        sandbox.updateCellSizeLabel();
        rebuildAllPoC2();
    </script>
</body>
