<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 3: Hybrid Planetary Clipmap Crust + Entrance Portals + Cavern Manifolds</title>
    <style>
        body { margin: 0; overflow: hidden; background: #04060c; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from './vendor/three.module.js';
        import { PlanetaryBaseSandbox, createTriplanarAsteroidMaterial, findSurfacePoint } from './shared/planetary_base_sandbox.js';

        // --- Fast 3D Simplex-Style Noise ---
        class FastNoise3D {
            constructor(seed = 1337) {
                this.seed = seed;
                this._octCache = [
                    { valid: false, X: 0, Y: 0, Z: 0, c000: 0, c100: 0, c010: 0, c110: 0, c001: 0, c101: 0, c011: 0, c111: 0 },
                    { valid: false, X: 0, Y: 0, Z: 0, c000: 0, c100: 0, c010: 0, c110: 0, c001: 0, c101: 0, c011: 0, c111: 0 },
                    { valid: false, X: 0, Y: 0, Z: 0, c000: 0, c100: 0, c010: 0, c110: 0, c001: 0, c101: 0, c011: 0, c111: 0 }
                ];
            }
            hash(x, y, z) {
                const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + this.seed) * 43758.5453123;
                return s - Math.floor(s);
            }
            noiseOct(x, y, z, oct) {
                const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
                const xd = x - X, yd = y - Y, zd = z - Z;
                const u = xd * xd * (3.0 - 2.0 * xd);
                const v = yd * yd * (3.0 - 2.0 * yd);
                const w = zd * zd * (3.0 - 2.0 * zd);
                const cache = this._octCache[oct];
                if (!cache || !cache.valid || cache.X !== X || cache.Y !== Y || cache.Z !== Z) {
                    const c000 = this.hash(X, Y, Z), c100 = this.hash(X+1, Y, Z);
                    const c010 = this.hash(X, Y+1, Z), c110 = this.hash(X+1, Y+1, Z);
                    const c001 = this.hash(X, Y, Z+1), c101 = this.hash(X+1, Y, Z+1);
                    const c011 = this.hash(X, Y+1, Z+1), c111 = this.hash(X+1, Y+1, Z+1);
                    if (!cache) {
                        const x00 = c000*(1-u)+c100*u, x10 = c010*(1-u)+c110*u;
                        const x01 = c001*(1-u)+c101*u, x11 = c011*(1-u)+c111*u;
                        const y0 = x00*(1-v)+x10*v, y1 = x01*(1-v)+x11*v;
                        return y0*(1-w)+y1*w;
                    }
                    cache.valid = true; cache.X = X; cache.Y = Y; cache.Z = Z;
                    cache.c000 = c000; cache.c100 = c100; cache.c010 = c010; cache.c110 = c110;
                    cache.c001 = c001; cache.c101 = c101; cache.c011 = c011; cache.c111 = c111;
                }
                const x00 = cache.c000*(1-u)+cache.c100*u, x10 = cache.c010*(1-u)+cache.c110*u;
                const x01 = cache.c001*(1-u)+cache.c101*u, x11 = cache.c011*(1-u)+cache.c111*u;
                const y0 = x00*(1-v)+x10*v, y1 = x01*(1-v)+x11*v;
                return y0*(1-w)+y1*w;
            }
            noise(x, y, z) {
                return this.noiseOct(x, y, z, 0);
            }
            fbm(x, y, z, octaves = 3) {
                let val = 0, amp = 0.5, freq = 1.0;
                for (let i = 0; i < octaves; i++) {
                    val += this.noiseOct(x * freq, y * freq, z * freq, i) * amp;
                    freq *= 2.0; amp *= 0.5;
                }
                return val;
            }
        }

        const noise = new FastNoise3D(777);

        let currentRadius = 2800;
        let planetaryMacroShell = null;
        const MACRO_GRID_RES = 8;
        let macroRaycastGrid = null;
        let macroRayStamp = 1;
        const _rcCellHit = new THREE.Vector3();
        const _rcTriA = new THREE.Vector3();
        const _rcTriB = new THREE.Vector3();
        const _rcTriC = new THREE.Vector3();
        const _rcTriHit = new THREE.Vector3();
        const _rcTriNorm = new THREE.Vector3();
        const _rcTriHelper = new THREE.Triangle();
        const _rcHitCells = [];
        const _poc3CoarseGrid = new Float32Array(5 * 5 * 5);
        const _poc3SinOreX = new Float32Array(32);
        const _poc3CellVertMap = new Int32Array(32 * 32 * 32);
        const _poc3CVals = new Float32Array(8);
        const _poc3CornerIdx = new Int32Array(8);
        let _poc3Verts = new Float32Array(16384 * 3);
        let _poc3Norms = new Float32Array(16384 * 3);
        let _poc3Cols = new Float32Array(16384 * 3);
        let _poc3ExtFlag = new Uint8Array(16384);
        let _poc3Indices = new Uint32Array(65536 * 3);
        const MAX_PORTALS = 4096;
        const portalHoles = []; // Array of { point: Vector3, radius: number, radiusSq: number }
        let nextPortalIndex = 0;

        // Clustered 3D Spatial Grid (32x32x32 cells x 16 portal IDs/cell in 1024x128 RGBA Float)
        // + Exact Portal Sphere List (64x64 RGBA Float = 4,096 portals)
        const PORTAL_GRID_RES = 32;
        const portalGridData = new Float32Array(1024 * 128 * 4);
        const portalGridTex = new THREE.DataTexture(portalGridData, 1024, 128, THREE.RGBAFormat, THREE.FloatType);
        portalGridTex.minFilter = THREE.NearestFilter;
        portalGridTex.magFilter = THREE.NearestFilter;
        portalGridTex.wrapS = THREE.ClampToEdgeWrapping;
        portalGridTex.wrapT = THREE.ClampToEdgeWrapping;
        portalGridTex.flipY = false;
        portalGridTex.needsUpdate = true;

        const portalListData = new Float32Array(64 * 64 * 4);
        const portalListTex = new THREE.DataTexture(portalListData, 64, 64, THREE.RGBAFormat, THREE.FloatType);
        portalListTex.minFilter = THREE.NearestFilter;
        portalListTex.magFilter = THREE.NearestFilter;
        portalListTex.wrapS = THREE.ClampToEdgeWrapping;
        portalListTex.wrapT = THREE.ClampToEdgeWrapping;
        portalListTex.flipY = false;
        portalListTex.needsUpdate = true;

        const QUALITY_PRESETS_POC3 = {
            low: { macroSegs: 80, cavernRes: 12 },
            medium: { macroSegs: 120, cavernRes: 16 },
            high: { macroSegs: 168, cavernRes: 22 },
            ultra: { macroSegs: 224, cavernRes: 28 }
        };
        let macroSegments = 168;
        // Scale-decoupled subterranean high-density voxel chunks (constant world space size across 10P/30P/50P)
        let SUBTERRANEAN_CHUNK_RES = 22;
        const SUBTERRANEAN_CHUNK_SIZE = 128.0;
        let SUBTERRANEAN_CELL_SIZE = SUBTERRANEAN_CHUNK_SIZE / SUBTERRANEAN_CHUNK_RES;
        let MACRO_COLLAR_INSET = 4.0;
        const MAX_SUBTERRANEAN_CHUNKS = 512;

        const subterraneanChunks = new Map();
        const voidChunkKeys = new Set();
        const activeSubterraneanMeshes = [];
        window.__POC3_CHUNKS__ = subterraneanChunks;

        // High-res Triplanar Materials (Macro crust supports clustered portal cutouts; Cavern supports vertex-color armor)
        const macroCrustMaterial = createTriplanarAsteroidMaterial({
            vertexColors: false,
            hasPortals: true,
            radius: currentRadius,
            portalGridTex,
            portalListTex
        });
        const cavernMaterial = createTriplanarAsteroidMaterial({
            vertexColors: true,
            hasPortals: false,
            radius: currentRadius
        });

        function evalMacroRadiusAt(wx, wy, wz) {
            const len = Math.sqrt(wx * wx + wy * wy + wz * wz) || 1.0;
            const freq = 0.0014 * 2800.0;
            const nx = (wx / len) * freq;
            const ny = (wy / len) * freq;
            const nz = (wz / len) * freq;
            const n = (noise.fbm(nx, ny, nz, 3) - 0.35) * (currentRadius * 0.18);
            return currentRadius + n;
        }

        function clearPortalGrid() {
            portalHoles.length = 0;
            nextPortalIndex = 0;
            portalGridData.fill(0);
            portalListData.fill(0);
            portalGridTex.needsUpdate = true;
            portalListTex.needsUpdate = true;
            macroCrustMaterial.userData.shaderUniforms.uPortalDomainHalf.value = currentRadius * 1.30;
        }

        function isPointInsideClusteredPortalCPU(worldPos) {
            const domainHalf = macroCrustMaterial.userData.shaderUniforms.uPortalDomainHalf.value;
            const domainSize = domainHalf * 2.0;
            const u = (worldPos.x + domainHalf) / domainSize;
            const v = (worldPos.y + domainHalf) / domainSize;
            const w = (worldPos.z + domainHalf) / domainSize;
            if (u < 0.0 || u > 1.0 || v < 0.0 || v > 1.0 || w < 0.0 || w > 1.0) return false;

            const cx = Math.max(0, Math.min(PORTAL_GRID_RES - 1, Math.floor(u * PORTAL_GRID_RES)));
            const cy = Math.max(0, Math.min(PORTAL_GRID_RES - 1, Math.floor(v * PORTAL_GRID_RES)));
            const cz = Math.max(0, Math.min(PORTAL_GRID_RES - 1, Math.floor(w * PORTAL_GRID_RES)));
            const baseX = ((cz % 8) * PORTAL_GRID_RES + cx) * 4;
            const baseY = Math.floor(cz / 8) * PORTAL_GRID_RES + cy;
            const cellBaseIdx = (baseY * 1024 + baseX) * 4;

            for (let s = 0; s < 16; s++) {
                const id = portalGridData[cellBaseIdx + s];
                if (id <= 0.0) return false;
                const slot = Math.round(id) - 1;
                if (slot < 0 || slot >= MAX_PORTALS) continue;
                const listBase = slot * 4;
                const pr = portalListData[listBase + 3];
                if (pr > 0.0) {
                    const dx = worldPos.x - portalListData[listBase];
                    const dy = worldPos.y - portalListData[listBase + 1];
                    const dz = worldPos.z - portalListData[listBase + 2];
                    if (Math.sqrt(dx * dx + dy * dy + dz * dz) < pr) {
                        return true;
                    }
                }
            }
            return false;
        }

        function registerPortalHole(point, brushRadius) {
            const cutRadius = brushRadius * 0.88;
            const distFromSurface = Math.abs(point.length() - evalMacroRadiusAt(point.x, point.y, point.z));
            // Only cut a surface portal in the macro crust if the carve sphere intersects the surface crust
            if (distFromSurface > brushRadius * 1.35) return;

            for (let i = 0; i < portalHoles.length; i++) {
                if (portalHoles[i].point.distanceTo(point) < cutRadius * 0.40 && portalHoles[i].radius >= cutRadius * 0.92) {
                    return; // Already covered by an existing portal cutout
                }
            }

            const portalSlot = nextPortalIndex % MAX_PORTALS;
            nextPortalIndex++;
            const portalObj = { point: point.clone(), radius: cutRadius, radiusSq: cutRadius * cutRadius };
            if (portalHoles.length < MAX_PORTALS) {
                portalHoles.push(portalObj);
            } else {
                portalHoles[portalSlot] = portalObj;
            }

            const listBase = portalSlot * 4;
            portalListData[listBase] = point.x;
            portalListData[listBase + 1] = point.y;
            portalListData[listBase + 2] = point.z;
            portalListData[listBase + 3] = cutRadius;
            portalListTex.needsUpdate = true;

            const portalId = portalSlot + 1.0;
            const domainHalf = currentRadius * 1.30;
            const domainSize = domainHalf * 2.0;
            const minCX = Math.max(0, Math.min(PORTAL_GRID_RES - 1, Math.floor(((point.x - cutRadius + domainHalf) / domainSize) * PORTAL_GRID_RES)));
            const maxCX = Math.max(0, Math.min(PORTAL_GRID_RES - 1, Math.floor(((point.x + cutRadius + domainHalf) / domainSize) * PORTAL_GRID_RES)));
            const minCY = Math.max(0, Math.min(PORTAL_GRID_RES - 1, Math.floor(((point.y - cutRadius + domainHalf) / domainSize) * PORTAL_GRID_RES)));
            const maxCY = Math.max(0, Math.min(PORTAL_GRID_RES - 1, Math.floor(((point.y + cutRadius + domainHalf) / domainSize) * PORTAL_GRID_RES)));
            const minCZ = Math.max(0, Math.min(PORTAL_GRID_RES - 1, Math.floor(((point.z - cutRadius + domainHalf) / domainSize) * PORTAL_GRID_RES)));
            const maxCZ = Math.max(0, Math.min(PORTAL_GRID_RES - 1, Math.floor(((point.z + cutRadius + domainHalf) / domainSize) * PORTAL_GRID_RES)));

            let minTileRow = 128;
            let maxTileRow = -1;
            for (let cz = minCZ; cz <= maxCZ; cz++) {
                const tileX = cz % 8;
                const tileY = Math.floor(cz / 8);
                for (let cy = minCY; cy <= maxCY; cy++) {
                    const baseY = tileY * 32 + cy;
                    if (baseY < minTileRow) minTileRow = baseY;
                    if (baseY > maxTileRow) maxTileRow = baseY;
                    for (let cx = minCX; cx <= maxCX; cx++) {
                        const baseX = (tileX * 32 + cx) * 4;
                        const cellBaseIdx = (baseY * 1024 + baseX) * 4;
                        let placed = false;
                        for (let s = 0; s < 16; s++) {
                            if (portalGridData[cellBaseIdx + s] === 0.0) {
                                portalGridData[cellBaseIdx + s] = portalId;
                                placed = true;
                                break;
                            }
                        }
                        if (!placed) {
                            for (let s = 0; s < 15; s++) {
                                portalGridData[cellBaseIdx + s] = portalGridData[cellBaseIdx + s + 1];
                            }
                            portalGridData[cellBaseIdx + 15] = portalId;
                        }
                    }
                }
            }

            if (minTileRow <= maxTileRow) {
                const gl = sandbox && sandbox.renderer ? sandbox.renderer.getContext() : null;
                const gridTexProps = sandbox && sandbox.renderer ? sandbox.renderer.properties.get(portalGridTex) : null;
                const glGridTex = gridTexProps ? gridTexProps.__webglTexture : null;
                if (gl && glGridTex) {
                    const rowCount = maxTileRow - minTileRow + 1;
                    const subView = portalGridData.subarray(minTileRow * 1024 * 4, (maxTileRow + 1) * 1024 * 4);
                    const prevTex = gl.getParameter(gl.TEXTURE_BINDING_2D);
                    const prevAlign = gl.getParameter(gl.UNPACK_ALIGNMENT);
                    const prevFlipY = gl.getParameter(gl.UNPACK_FLIP_Y_WEBGL);
                    gl.bindTexture(gl.TEXTURE_2D, glGridTex);
                    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
                    if (prevFlipY) gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
                    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, minTileRow, 1024, rowCount, gl.RGBA, gl.FLOAT, subView);
                    if (prevFlipY) gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, prevFlipY);
                    gl.pixelStorei(gl.UNPACK_ALIGNMENT, prevAlign);
                    gl.bindTexture(gl.TEXTURE_2D, prevTex);
                } else {
                    portalGridTex.needsUpdate = true;
                }
            }
        }

        // High-Resolution Smooth Macro Planetary Shell
        function buildMacroCrust(scene) {
            if (planetaryMacroShell) {
                scene.remove(planetaryMacroShell);
                planetaryMacroShell.geometry.dispose();
                planetaryMacroShell = null;
            }
            macroRaycastGrid = null;

            const geo = new THREE.SphereGeometry(currentRadius, macroSegments, macroSegments);
            const pos = geo.attributes.position;

            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const vz = pos.getZ(i);
                const len = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1.0;
                const scale = evalMacroRadiusAt(vx, vy, vz) / len;
                pos.setXYZ(i, vx * scale, vy * scale, vz * scale);
            }
            geo.computeVertexNormals();
            geo.computeBoundingBox();

            // Build 8x8x8 spatial triangle grid for fast portal-aware customRaycast
            const bbox = geo.boundingBox;
            const gMinX = bbox.min.x - 1.0, gMinY = bbox.min.y - 1.0, gMinZ = bbox.min.z - 1.0;
            const gMaxX = bbox.max.x + 1.0, gMaxY = bbox.max.y + 1.0, gMaxZ = bbox.max.z + 1.0;
            const cellW = (gMaxX - gMinX) / MACRO_GRID_RES;
            const cellH = (gMaxY - gMinY) / MACRO_GRID_RES;
            const cellD = (gMaxZ - gMinZ) / MACRO_GRID_RES;
            const invW = MACRO_GRID_RES / (gMaxX - gMinX);
            const invH = MACRO_GRID_RES / (gMaxY - gMinY);
            const invD = MACRO_GRID_RES / (gMaxZ - gMinZ);

            const gridCells = [];
            for (let gz = 0; gz < MACRO_GRID_RES; gz++) {
                for (let gy = 0; gy < MACRO_GRID_RES; gy++) {
                    for (let gx = 0; gx < MACRO_GRID_RES; gx++) {
                        gridCells.push({
                            box: new THREE.Box3(
                                new THREE.Vector3(gMinX + gx * cellW, gMinY + gy * cellH, gMinZ + gz * cellD),
                                new THREE.Vector3(gMinX + (gx + 1) * cellW, gMinY + (gy + 1) * cellH, gMinZ + (gz + 1) * cellD)
                            ),
                            tris: []
                        });
                    }
                }
            }

            const idxAttr = geo.index;
            const triCount = idxAttr ? (idxAttr.count / 3) : (pos.count / 3);
            for (let t = 0; t < triCount; t++) {
                const i0 = idxAttr ? idxAttr.getX(t * 3) : t * 3;
                const i1 = idxAttr ? idxAttr.getX(t * 3 + 1) : t * 3 + 1;
                const i2 = idxAttr ? idxAttr.getX(t * 3 + 2) : t * 3 + 2;
                const ax = pos.getX(i0), ay = pos.getY(i0), az = pos.getZ(i0);
                const bx = pos.getX(i1), by = pos.getY(i1), bz = pos.getZ(i1);
                const cx = pos.getX(i2), cy = pos.getY(i2), cz = pos.getZ(i2);

                const tMinX = Math.min(ax, bx, cx), tMaxX = Math.max(ax, bx, cx);
                const tMinY = Math.min(ay, by, cy), tMaxY = Math.max(ay, by, cy);
                const tMinZ = Math.min(az, bz, cz), tMaxZ = Math.max(az, bz, cz);

                const cMinX = Math.max(0, Math.min(MACRO_GRID_RES - 1, Math.floor((tMinX - gMinX) * invW)));
                const cMaxX = Math.max(0, Math.min(MACRO_GRID_RES - 1, Math.floor((tMaxX - gMinX) * invW)));
                const cMinY = Math.max(0, Math.min(MACRO_GRID_RES - 1, Math.floor((tMinY - gMinY) * invH)));
                const cMaxY = Math.max(0, Math.min(MACRO_GRID_RES - 1, Math.floor((tMaxY - gMinY) * invH)));
                const cMinZ = Math.max(0, Math.min(MACRO_GRID_RES - 1, Math.floor((tMinZ - gMinZ) * invD)));
                const cMaxZ = Math.max(0, Math.min(MACRO_GRID_RES - 1, Math.floor((tMaxZ - gMinZ) * invD)));

                for (let gz = cMinZ; gz <= cMaxZ; gz++) {
                    for (let gy = cMinY; gy <= cMaxY; gy++) {
                        for (let gx = cMinX; gx <= cMaxX; gx++) {
                            gridCells[gx + gy * MACRO_GRID_RES + gz * MACRO_GRID_RES * MACRO_GRID_RES].tris.push(t);
                        }
                    }
                }
            }

            macroRaycastGrid = {
                cells: gridCells.filter(c => c.tris.length > 0),
                posAttr: pos,
                indexAttr: idxAttr,
                testedStamp: new Uint32Array(triCount)
            };

            planetaryMacroShell = new THREE.Mesh(geo, macroCrustMaterial);
            planetaryMacroShell.userData = { isMacroShell: true };
            scene.add(planetaryMacroShell);
        }

        // Subterranean Voxel Chunk (Dual-Grid Surface Nets mesher restricted to carved cavern manifolds)
        class SubterraneanChunk {
            constructor(cx, cy, cz) {
                this.cx = cx;
                this.cy = cy;
                this.cz = cz;
                this.key = `${cx},${cy},${cz}`;
                this.minBounds = new THREE.Vector3(cx * SUBTERRANEAN_CHUNK_SIZE, cy * SUBTERRANEAN_CHUNK_SIZE, cz * SUBTERRANEAN_CHUNK_SIZE);
                this.maxBounds = this.minBounds.clone().addScalar(SUBTERRANEAN_CHUNK_SIZE);
                this.mesh = null;
                this.hasArmor = false;
                this.isAllVoid = false;
                this.hasNearCarve = false;
                this.maxCarveInChunk = -SUBTERRANEAN_CELL_SIZE * 4.0;

                const pRes = SUBTERRANEAN_CHUNK_RES + 3;
                const total = pRes * pRes * pRes;
                this.voxelData = new Float32Array(total);
                this.carveField = new Float32Array(total);
                this.materialData = new Uint8Array(total);

                this.initField();
            }

            initField() {
                const pRes = SUBTERRANEAN_CHUNK_RES + 3;
                const minR = currentRadius * 0.85;
                const maxR = currentRadius * 1.18;
                const oreFreq = 0.008; // Fixed ship-scale mineral veins in subterranean caverns

                const halfSpan = (pRes - 1) * SUBTERRANEAN_CELL_SIZE * 0.5;
                const ccx = this.minBounds.x - SUBTERRANEAN_CELL_SIZE + halfSpan;
                const ccy = this.minBounds.y - SUBTERRANEAN_CELL_SIZE + halfSpan;
                const ccz = this.minBounds.z - SUBTERRANEAN_CELL_SIZE + halfSpan;
                const cDist = Math.sqrt(ccx * ccx + ccy * ccy + ccz * ccz);
                const halfDiag = halfSpan * 1.732051;
                const touchesCrust = (cDist + halfDiag >= minR) && (cDist - halfDiag <= maxR);

                const GRID = 5;
                const GRID2 = GRID * GRID;
                const span = pRes - 1;
                if (touchesCrust) {
                    let gIdx = 0;
                    for (let gz = 0; gz < GRID; gz++) {
                        const wz = this.minBounds.z + ((gz / 4.0) * span - 1) * SUBTERRANEAN_CELL_SIZE;
                        for (let gy = 0; gy < GRID; gy++) {
                            const wy = this.minBounds.y + ((gy / 4.0) * span - 1) * SUBTERRANEAN_CELL_SIZE;
                            for (let gx = 0; gx < GRID; gx++) {
                                const wx = this.minBounds.x + ((gx / 4.0) * span - 1) * SUBTERRANEAN_CELL_SIZE;
                                _poc3CoarseGrid[gIdx++] = evalMacroRadiusAt(wx, wy, wz);
                            }
                        }
                    }
                }

                const invSpan4 = 4.0 / span;
                const defaultCarve = -SUBTERRANEAN_CELL_SIZE * 4.0;
                this.maxCarveInChunk = defaultCarve;
                for (let px = 0; px < pRes; px++) {
                    _poc3SinOreX[px] = Math.sin((this.minBounds.x + (px - 1) * SUBTERRANEAN_CELL_SIZE) * oreFreq);
                }
                let idx = 0;
                for (let pz = 0; pz < pRes; pz++) {
                    const wz = this.minBounds.z + (pz - 1) * SUBTERRANEAN_CELL_SIZE;
                    const wz2 = wz * wz;
                    let iz0 = 0, tz = 0.0;
                    if (touchesCrust) {
                        const fz = pz * invSpan4;
                        iz0 = Math.min(3, Math.floor(fz));
                        tz = fz - iz0;
                    }
                    for (let py = 0; py < pRes; py++) {
                        const wy = this.minBounds.y + (py - 1) * SUBTERRANEAN_CELL_SIZE;
                        const wyz2 = wz2 + wy * wy;
                        const cosOreY = Math.cos(wy * oreFreq);
                        const checkOreY = Math.abs(cosOreY) > 0.78;
                        let iy0 = 0, ty = 0.0;
                        if (touchesCrust) {
                            const fy = py * invSpan4;
                            iy0 = Math.min(3, Math.floor(fy));
                            ty = fy - iy0;
                        }
                        for (let px = 0; px < pRes; px++) {
                            const wx = this.minBounds.x + (px - 1) * SUBTERRANEAN_CELL_SIZE;

        }

        function reinforceSpherePoC3(hitPoint, brushRadius) {
            const pRes = SUBTERRANEAN_CHUNK_RES + 3;
            const pRes2 = pRes * pRes;
            const pad = brushRadius + SUBTERRANEAN_CELL_SIZE;
            const invCell = 1.0 / SUBTERRANEAN_CELL_SIZE;
            const minCX = Math.floor((hitPoint.x - pad) / SUBTERRANEAN_CHUNK_SIZE);
            const maxCX = Math.floor((hitPoint.x + pad) / SUBTERRANEAN_CHUNK_SIZE);
            const minCY = Math.floor((hitPoint.y - pad) / SUBTERRANEAN_CHUNK_SIZE);
            const maxCY = Math.floor((hitPoint.y + pad) / SUBTERRANEAN_CHUNK_SIZE);
            const minCZ = Math.floor((hitPoint.z - pad) / SUBTERRANEAN_CHUNK_SIZE);
            const maxCZ = Math.floor((hitPoint.z + pad) / SUBTERRANEAN_CHUNK_SIZE);

            for (let cz = minCZ; cz <= maxCZ; cz++) {
                for (let cy = minCY; cy <= maxCY; cy++) {
                    for (let cx = minCX; cx <= maxCX; cx++) {
                        const chunk = subterraneanChunks.get(`${cx},${cy},${cz}`);
                        if (!chunk) continue;

                        const minPX = Math.max(0, Math.floor((hitPoint.x - pad - chunk.minBounds.x) * invCell + 1));
                        const maxPX = Math.min(pRes - 1, Math.ceil((hitPoint.x + pad - chunk.minBounds.x) * invCell + 1));
                        const minPY = Math.max(0, Math.floor((hitPoint.y - pad - chunk.minBounds.y) * invCell + 1));
                        const maxPY = Math.min(pRes - 1, Math.ceil((hitPoint.y + pad - chunk.minBounds.y) * invCell + 1));
                        const minPZ = Math.max(0, Math.floor((hitPoint.z - pad - chunk.minBounds.z) * invCell + 1));
                        const maxPZ = Math.min(pRes - 1, Math.ceil((hitPoint.z + pad - chunk.minBounds.z) * invCell + 1));
                        if (minPX > maxPX || minPY > maxPY || minPZ > maxPZ) continue;

                        let modified = false;
                        const rSq = brushRadius * brushRadius;
                        for (let pz = minPZ; pz <= maxPZ; pz++) {
                            const dz = chunk.minBounds.z + (pz - 1) * SUBTERRANEAN_CELL_SIZE - hitPoint.z;
                            const dz2 = dz * dz;
                            const zOff = pz * pRes2;
                            for (let py = minPY; py <= maxPY; py++) {
                                const dy = chunk.minBounds.y + (py - 1) * SUBTERRANEAN_CELL_SIZE - hitPoint.y;
                                const dyz2 = dz2 + dy * dy;
                                if (dyz2 > rSq) continue;
                                const yzOff = zOff + py * pRes;
                                for (let px = minPX; px <= maxPX; px++) {
                                    const dx = chunk.minBounds.x + (px - 1) * SUBTERRANEAN_CELL_SIZE - hitPoint.x;
                                    const idx = yzOff + px;
                                    if (dyz2 + dx * dx <= rSq && chunk.voxelData[idx] < 0) {
                                        chunk.materialData[idx] = 3; // Reinforced Titanium Bulkhead
                                        chunk.hasArmor = true;
                                        modified = true;
                                    }
                                }
                            }
                        }
                        if (modified) {
                            chunk.rebuild(sandbox.scene);
                        }
                    }
                }
            }
        }

        function computeMacroCollarInset() {
            return Math.max(4.0, Math.min(12.0, currentRadius * (1.0 - Math.cos(Math.PI / macroSegments)) * 1.5 + 1.5));
        }

        function applyQualityConfigPoC3(qualityKey) {
            const preset = QUALITY_PRESETS_POC3[qualityKey] || QUALITY_PRESETS_POC3.high;
            macroSegments = preset.macroSegs;
            SUBTERRANEAN_CHUNK_RES = preset.cavernRes;
            SUBTERRANEAN_CELL_SIZE = SUBTERRANEAN_CHUNK_SIZE / SUBTERRANEAN_CHUNK_RES;
            MACRO_COLLAR_INSET = computeMacroCollarInset();
        }

        function buildStarterTunnelPoC3() {
            const tunnelDir = new THREE.Vector3(0.14, 0.12, 1.0).normalize();
            const surfPt = findSurfacePoint(
                (wx, wy, wz) => Math.hypot(wx, wy, wz) - evalMacroRadiusAt(wx, wy, wz),
                tunnelDir,
                currentRadius * 0.6,
                currentRadius * 1.4
            );
            carveSpherePoC3(surfPt, 175);
            carveSpherePoC3(surfPt.clone().addScaledVector(tunnelDir, -135), 155);
            reinforceSpherePoC3(surfPt.clone().addScaledVector(tunnelDir, -125), 195);
        }

        function rebuildScenePoC3() {
            clearPortalGrid();
            activeSubterraneanMeshes.forEach(m => {
                sandbox.scene.remove(m);
                m.geometry.dispose();
            });
            activeSubterraneanMeshes.length = 0;
            subterraneanChunks.clear();
            voidChunkKeys.clear();

            SUBTERRANEAN_CELL_SIZE = SUBTERRANEAN_CHUNK_SIZE / SUBTERRANEAN_CHUNK_RES;
            MACRO_COLLAR_INSET = computeMacroCollarInset();
            macroCrustMaterial.userData.shaderUniforms.uAsteroidRadius.value = currentRadius;
            macroCrustMaterial.userData.shaderUniforms.uPortalDomainHalf.value = currentRadius * 1.30;
            cavernMaterial.userData.shaderUniforms.uAsteroidRadius.value = currentRadius;

            buildMacroCrust(sandbox.scene);
            buildStarterTunnelPoC3();
            if (typeof sandbox !== 'undefined' && sandbox) {
                sandbox.updateCellSizeLabel();
            }
        }

        // Shared Sandbox Setup
        const sandbox = new PlanetaryBaseSandbox({
            pocId: 'poc3',
            pocTitle: 'Option 3: Clipmap Shell & Subterranean Manifolds',
            defaultRadius: currentRadius,
            getCollisionMesh: () => {
                const list = [];
                if (planetaryMacroShell) list.push(planetaryMacroShell);
                list.push(...activeSubterraneanMeshes);
                return list;
            },
            getVisualMesh: () => {
                const list = [];
                if (planetaryMacroShell) list.push(planetaryMacroShell);
                list.push(...activeSubterraneanMeshes);
                return list;
            },
            auditVisualCollisionParity: (raycaster) => {
                const visTargets = [];
                if (planetaryMacroShell) visTargets.push(planetaryMacroShell);
                visTargets.push(...activeSubterraneanMeshes);
                const visHits = visTargets.length > 0 ? raycaster.intersectObjects(visTargets, false) : [];
                let visHit = null;
                for (let i = 0; i < visHits.length; i++) {
                    const h = visHits[i];
                    if (h.object === planetaryMacroShell && isPointInsideClusteredPortalCPU(h.point)) {
                        continue;
                    }
                    visHit = h;
                    break;
                }
                const colHit = sandbox.config.customRaycast(raycaster, null, null);
                if (!visHit && !colHit) return null;
                return Math.abs((visHit ? visHit.distance : 0) - (colHit ? colHit.distance : 0));
            },
            getCellSize: () => `${SUBTERRANEAN_CELL_SIZE.toFixed(1)}u (${macroSegments}seg / ${SUBTERRANEAN_CHUNK_RES}³)`,

            // Portal-aware raycast accelerated by 8x8x8 spatial triangle grid (supports world-space rays)
            customRaycast: (raycaster, camera, mousePos) => {
                if (camera && mousePos) {
                    raycaster.setFromCamera(mousePos, camera);
                }

                let bestSubHit = null;
                if (activeSubterraneanMeshes.length > 0) {
                    const subHits = raycaster.intersectObjects(activeSubterraneanMeshes, false);
                    if (subHits.length > 0) bestSubHit = subHits[0];
                }

                if (planetaryMacroShell && macroRaycastGrid) {
                    const ray = raycaster.ray;
                    const ro = ray.origin;
                    const cells = macroRaycastGrid.cells;
                    _rcHitCells.length = 0;

                    for (let c = 0; c < cells.length; c++) {
                        const cell = cells[c];
                        if (cell.box.containsPoint(ro)) {
                            _rcHitCells.push({ cell, dist: 0 });
                        } else if (ray.intersectBox(cell.box, _rcCellHit)) {
                            _rcHitCells.push({ cell, dist: ro.distanceTo(_rcCellHit) });
                        }
                    }
                    if (_rcHitCells.length > 1) {
                        _rcHitCells.sort((a, b) => a.dist - b.dist);
                    }

                    if (++macroRayStamp === 0xffffffff) {
                        macroRaycastGrid.testedStamp.fill(0);
                        macroRayStamp = 1;
                    }
                    const stamp = macroRayStamp;
                    const tested = macroRaycastGrid.testedStamp;
                    const posAttr = macroRaycastGrid.posAttr;
                    const idxAttr = macroRaycastGrid.indexAttr;

                    let bestDist = Math.min(bestSubHit ? bestSubHit.distance : Infinity, raycaster.far);
                    let bestMacroHit = null;

                    for (let i = 0; i < _rcHitCells.length; i++) {
                        const entry = _rcHitCells[i];
                        if (entry.dist > bestDist) break;
                        const tris = entry.cell.tris;
                        for (let k = 0; k < tris.length; k++) {
                            const t = tris[k];
                            if (tested[t] === stamp) continue;
                            tested[t] = stamp;

                            const i0 = idxAttr ? idxAttr.getX(t * 3) : t * 3;
                            const i1 = idxAttr ? idxAttr.getX(t * 3 + 1) : t * 3 + 1;
                            const i2 = idxAttr ? idxAttr.getX(t * 3 + 2) : t * 3 + 2;

                            _rcTriA.fromBufferAttribute(posAttr, i0);
                            _rcTriB.fromBufferAttribute(posAttr, i1);
                            _rcTriC.fromBufferAttribute(posAttr, i2);

                            const hitPt = ray.intersectTriangle(_rcTriA, _rcTriB, _rcTriC, false, _rcTriHit);
                            if (!hitPt) continue;

                            const dist = ro.distanceTo(hitPt);
                            if (dist < raycaster.near || dist > raycaster.far || dist >= bestDist) continue;

                            let insideCutout = false;
                            for (let p = 0; p < portalHoles.length; p++) {
                                if (hitPt.distanceToSquared(portalHoles[p].point) < portalHoles[p].radiusSq) {
                                    insideCutout = true;
                                    break;
                                }
                            }
                            if (insideCutout) continue;

                            _rcTriHelper.set(_rcTriA, _rcTriB, _rcTriC);
                            _rcTriHelper.getNormal(_rcTriNorm);
                            if (_rcTriNorm.dot(ray.direction) > 0) _rcTriNorm.negate();

                            bestDist = dist;
                            bestMacroHit = {
                                distance: dist,
                                point: hitPt.clone(),
                                face: { a: i0, b: i1, c: i2, normal: _rcTriNorm.clone(), materialIndex: 0 },
                                object: planetaryMacroShell
                            };
                        }
                    }

                    return bestMacroHit || bestSubHit;
                }

                // Fallback when macroRaycastGrid is absent
                const targets = [...activeSubterraneanMeshes];
                if (planetaryMacroShell) targets.push(planetaryMacroShell);
                const hits = raycaster.intersectObjects(targets, false);

                for (let i = 0; i < hits.length; i++) {
                    const h = hits[i];
                    if (h.object === planetaryMacroShell) {
                        const insideCutout = portalHoles.some(p => h.point.distanceToSquared(p.point) < p.radiusSq);
                        if (insideCutout) continue; // Ignore discarded portal pixels
                    }
                    return h;
                }
                return null;
            },

            onCarve: async (hitPoint, hitNormal, brushRadius, mode) => {
                carveSpherePoC3(hitPoint, brushRadius);
            },

            onReinforce: async (hitPoint, hitNormal, brushRadius) => {
                reinforceSpherePoC3(hitPoint, brushRadius);
            },

            checkMaterialAtHit: (point, hit) => {
                if (hit && hit.face && hit.object !== planetaryMacroShell) {
                    const colAttr = hit.object.geometry.attributes.color;
                    if (colAttr) {
                        const a = hit.face.a;
                        if (colAttr.getY(a) > 0.8 && colAttr.getZ(a) > 0.9) {
                            return true;
                        }
                    }
                }
                return false;
            },

            onScaleChange: (scaleKey, radius) => {
                currentRadius = radius;
                rebuildScenePoC3();
            },

            onQualityChange: (qualityKey) => {
                applyQualityConfigPoC3(qualityKey);
                rebuildScenePoC3();
            },

            onToggleWireframe: (enabled) => {
                macroCrustMaterial.wireframe = enabled;
                cavernMaterial.wireframe = enabled;
            },

            onToggleXRay: (enabled, plane) => {
                macroCrustMaterial.clippingPlanes = enabled ? [plane] : [];
                cavernMaterial.clippingPlanes = enabled ? [plane] : [];
                macroCrustMaterial.needsUpdate = true;
                cavernMaterial.needsUpdate = true;
            }
        });

        currentRadius = sandbox.currentRadius;
        applyQualityConfigPoC3(sandbox.currentQuality);
        rebuildScenePoC3();
        sandbox.updateCellSizeLabel();
    </script>
</body>
