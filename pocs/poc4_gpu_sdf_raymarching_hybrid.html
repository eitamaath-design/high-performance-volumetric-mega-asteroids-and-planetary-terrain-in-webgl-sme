<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 4: 3D Volume SDF Raymarching + Shared Trilinear SDF Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background: #04060c; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from './vendor/three.module.js';
        import { PlanetaryBaseSandbox, findSurfacePoint } from './shared/planetary_base_sandbox.js';

        // --- Fast 3D Simplex-Style Noise ---
        class FastNoise3D {
            constructor(seed = 1337) { this.seed = seed; }
            hash(x, y, z) {
                const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + this.seed) * 43758.5453123;
                return s - Math.floor(s);
            }
            noise(x, y, z) {
                const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
                const xd = x - X, yd = y - Y, zd = z - Z;
                const u = xd * xd * (3.0 - 2.0 * xd);
                const v = yd * yd * (3.0 - 2.0 * yd);
                const w = zd * zd * (3.0 - 2.0 * zd);
                const c000 = this.hash(X, Y, Z), c100 = this.hash(X+1, Y, Z);
                const c010 = this.hash(X, Y+1, Z), c110 = this.hash(X+1, Y+1, Z);
                const c001 = this.hash(X, Y, Z+1), c101 = this.hash(X+1, Y, Z+1);
                const c011 = this.hash(X, Y+1, Z+1), c111 = this.hash(X+1, Y+1, Z+1);
                const x00 = c000*(1-u)+c100*u, x10 = c010*(1-u)+c110*u;
                const x01 = c001*(1-u)+c101*u, x11 = c011*(1-u)+c111*u;
                const y0 = x00*(1-v)+x10*v, y1 = x01*(1-v)+x11*v;
                return y0*(1-w)+y1*w;
            }
            fbm(x, y, z, octaves = 3) {
                let val = 0, amp = 0.5, freq = 1.0;
                for (let i = 0; i < octaves; i++) {
                    val += this.noise(x * freq, y * freq, z * freq) * amp;
                    freq *= 2.0; amp *= 0.5;
                }
                return val;
            }
        }

        const noise = new FastNoise3D(999);

        const QUALITY_PRESETS_POC4 = { low: 64, medium: 96, high: 112, ultra: 136 };
        let currentRadius = 2800;
        let VOL_RES = 112; // Configurable by quality tier (64^3 .. 136^3)
        let DOMAIN_HALF = currentRadius * 1.32;
        let VOXEL_SPACING = (DOMAIN_HALF * 2.0) / VOL_RES;

        // Orthogonal 4-Channel RGBA Volume Buffer:
        // R = Signed Distance (normalized d / DOMAIN_HALF)
        // G = Mineral Ore Vein mask [0, 1]
        // B = Reinforced Titanium Armor mask [0, 1]
        // A = Reserved padding (1.0)
        let volumeData = new Float32Array(VOL_RES * VOL_RES * VOL_RES * 4);
        let volumeUploadData = null;
        let subScratchU16 = null;
        let subScratchF32 = null;
        let isSoftwareGL = false;
        let useHalfFloat = true;
        let volumeTexture = null;
        let volumeBoxMesh = null;
        let raymarchMaterial = null;
        const viewProjMatrix = new THREE.Matrix4();
        const _rcBox = new THREE.Box3();
        const _rcBoxMin = new THREE.Vector3();
        const _rcBoxMax = new THREE.Vector3();
        const _rcEntryPt = new THREE.Vector3();
        const _rcP = new THREE.Vector3();
        const _rcMp = new THREE.Vector3();
        const _colCurPos = new THREE.Vector3();
        const _colRemDelta = new THREE.Vector3();
        const _colStep = new THREE.Vector3();
        const _colGrad = new THREE.Vector3();
        const _colNormal = new THREE.Vector3();
        const _colHitPt = new THREE.Vector3();

        function evalDensityPoC4(wx, wy, wz) {
            const dist = Math.sqrt(wx * wx + wy * wy + wz * wz);
            const freq = 0.0015 * (2800.0 / currentRadius);
            const n = (noise.fbm(wx * freq, wy * freq, wz * freq, 4) - 0.35) * (currentRadius * 0.24);
            return dist - (currentRadius + n);
        }

        // Initialize 3D Volume Field
        function initVolumeField() {
            DOMAIN_HALF = currentRadius * 1.32;
            VOXEL_SPACING = (DOMAIN_HALF * 2.0) / VOL_RES;

            const neededLen = VOL_RES * VOL_RES * VOL_RES * 4;
            if (volumeData.length !== neededLen) {
                volumeData = new Float32Array(neededLen);
            }

            const outerSkipR = currentRadius * 1.18;
            const outerBiasR = currentRadius * 1.10;
            const oreFreq = 0.006 * (2800.0 / currentRadius);
            const oreThreshold = -VOXEL_SPACING * 2.1;
            let idx = 0;
            for (let z = 0; z < VOL_RES; z++) {
                const wz = -DOMAIN_HALF + (z + 0.5) * VOXEL_SPACING;
                for (let y = 0; y < VOL_RES; y++) {
                    const wy = -DOMAIN_HALF + (y + 0.5) * VOXEL_SPACING;
                    for (let x = 0; x < VOL_RES; x++) {
                        const wx = -DOMAIN_HALF + (x + 0.5) * VOXEL_SPACING;
                        const rDist = Math.sqrt(wx * wx + wy * wy + wz * wz);
                        const d = rDist > outerSkipR ? (rDist - outerBiasR) : evalDensityPoC4(wx, wy, wz);

                        const idx4 = idx * 4;
                        volumeData[idx4 + 0] = d / DOMAIN_HALF;
                        // Organic subterranean gold ore veins (> 2.1 voxels deep so 4-tap B-spline never bleeds onto untouched exterior crust)
                        let isOre = 0.0;
                        if (d < oreThreshold) {
                            const v1 = noise.fbm(wx * oreFreq * 0.45 + 11.3, wy * oreFreq * 0.45 + 7.1, wz * oreFreq * 0.45 - 3.7, 2);
                            const v2 = noise.noise(wx * oreFreq * 0.9 - 5.2, wy * oreFreq * 0.9 + 19.4, wz * oreFreq * 0.9 + 8.1);
                            if (v1 > 0.58 && v2 > 0.52) isOre = 1.0;
                        }
                        volumeData[idx4 + 1] = isOre;
                        volumeData[idx4 + 2] = 0.0;
                        volumeData[idx4 + 3] = 1.0;
                        idx++;
                    }
                }
            }

            if (volumeTexture) {
                volumeTexture.dispose();
            }

            let texBackingData = volumeData;
            if (useHalfFloat) {
                if (!volumeUploadData || volumeUploadData.length !== neededLen) {
                    volumeUploadData = new Uint16Array(neededLen);
                }
                for (let i = 0; i < neededLen; i++) {
                    volumeUploadData[i] = THREE.DataUtils.toHalfFloat(volumeData[i]);
                }
                texBackingData = volumeUploadData;
            } else {
                volumeUploadData = null;
            }

            volumeTexture = new THREE.Data3DTexture(texBackingData, VOL_RES, VOL_RES, VOL_RES);
            volumeTexture.format = THREE.RGBAFormat;
            volumeTexture.type = useHalfFloat ? THREE.HalfFloatType : THREE.FloatType;
            volumeTexture.minFilter = THREE.LinearFilter;
            volumeTexture.magFilter = THREE.LinearFilter;
            volumeTexture.wrapS = THREE.ClampToEdgeWrapping;
            volumeTexture.wrapT = THREE.ClampToEdgeWrapping;
            volumeTexture.wrapR = THREE.ClampToEdgeWrapping;
            volumeTexture.unpackAlignment = 1;
            volumeTexture.needsUpdate = true;
            if (sandbox && sandbox.renderer) {
                sandbox.renderer.initTexture(volumeTexture);
            }
        }

        // Dirty-AABB WebGL2 sub-volume texture upload (avoids full 3D volume re-upload per carve tick)
        function uploadVolumeSubBox(minX, maxX, minY, maxY, minZ, maxZ) {
            if (!volumeTexture) return;
            minX = Math.max(0, minX); maxX = Math.min(VOL_RES - 1, maxX);
            minY = Math.max(0, minY); maxY = Math.min(VOL_RES - 1, maxY);
            minZ = Math.max(0, minZ); maxZ = Math.min(VOL_RES - 1, maxZ);
            if (minX > maxX || minY > maxY || minZ > maxZ) return;

            const w = maxX - minX + 1;
            const h = maxY - minY + 1;
            const d = maxZ - minZ + 1;
            const volRes2 = VOL_RES * VOL_RES;

            const gl = sandbox && sandbox.renderer ? sandbox.renderer.getContext() : null;
            const texProps = sandbox && sandbox.renderer ? sandbox.renderer.properties.get(volumeTexture) : null;
            const glTex = texProps ? texProps.__webglTexture : null;

            if (!gl || !glTex) {
                if (useHalfFloat && volumeTexture.image && volumeTexture.image.data) {
                    const mirror = volumeTexture.image.data;
                    for (let z = minZ; z <= maxZ; z++) {
                        const zBase = z * volRes2;
                        for (let y = minY; y <= maxY; y++) {
                            const rowBase = (zBase + y * VOL_RES + minX) * 4;
                            const rowLen = w * 4;
                            for (let i = 0; i < rowLen; i++) {
                                mirror[rowBase + i] = THREE.DataUtils.toHalfFloat(volumeData[rowBase + i]);
                            }
                        }
                    }
                }
                volumeTexture.needsUpdate = true;
                return;
            }

            const needed = w * h * d * 4;
            let subBuf;
            if (useHalfFloat) {
                if (!subScratchU16 || subScratchU16.length < needed) {
                    subScratchU16 = new Uint16Array(needed);
                }
                subBuf = subScratchU16.subarray(0, needed);
                const mirror = volumeTexture.image && volumeTexture.image.data ? volumeTexture.image.data : null;
                let dst = 0;
                for (let z = minZ; z <= maxZ; z++) {
                    const zBase = z * volRes2;
                    for (let y = minY; y <= maxY; y++) {
                        const rowBase = (zBase + y * VOL_RES + minX) * 4;
                        const rowLen = w * 4;
                        for (let i = 0; i < rowLen; i++) {
                            const srcIdx = rowBase + i;
                            const hf = THREE.DataUtils.toHalfFloat(volumeData[srcIdx]);
                            subBuf[dst++] = hf;
                            if (mirror) mirror[srcIdx] = hf;
                        }
                    }
                }
            } else {
                if (!subScratchF32 || subScratchF32.length < needed) {
                    subScratchF32 = new Float32Array(needed);
                }
                subBuf = subScratchF32.subarray(0, needed);
                let dst = 0;
                for (let z = minZ; z <= maxZ; z++) {
                    const zBase = z * volRes2;
                    for (let y = minY; y <= maxY; y++) {
                        const rowBase = (zBase + y * VOL_RES + minX) * 4;
                        const rowLen = w * 4;
                        subBuf.set(volumeData.subarray(rowBase, rowBase + rowLen), dst);
                        dst += rowLen;
                    }
                }
            }

            const prevTex = gl.getParameter(gl.TEXTURE_BINDING_3D);
            const prevAlign = gl.getParameter(gl.UNPACK_ALIGNMENT);
            const prevFlipY = gl.getParameter(gl.UNPACK_FLIP_Y_WEBGL);
            gl.bindTexture(gl.TEXTURE_3D, glTex);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
            if (prevFlipY) gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            gl.texSubImage3D(
                gl.TEXTURE_3D,
                0,
                minX, minY, minZ,
                w, h, d,
                gl.RGBA,
                useHalfFloat ? gl.HALF_FLOAT : gl.FLOAT,
                subBuf
            );
            if (prevFlipY) gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, prevFlipY);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, prevAlign);
            gl.bindTexture(gl.TEXTURE_3D, prevTex);
        }

        // Zero-allocation CPU Trilinear SDF Distance Sampler (Exact match with GPU sampler3D texel centers)
        function cpuSampleSDFDistance(wx, wy, wz) {
            const invSpan = 1.0 / (DOMAIN_HALF * 2.0);
            const u = (wx + DOMAIN_HALF) * invSpan;
            const v = (wy + DOMAIN_HALF) * invSpan;
            const w = (wz + DOMAIN_HALF) * invSpan;

            if (u < 0 || u > 1 || v < 0 || v > 1 || w < 0 || w > 1) {
                return 1000.0;
            }

            const maxIdx = VOL_RES - 1;
            const gx = Math.max(0, Math.min(maxIdx, u * VOL_RES - 0.5));
            const gy = Math.max(0, Math.min(maxIdx, v * VOL_RES - 0.5));
            const gz = Math.max(0, Math.min(maxIdx, w * VOL_RES - 0.5));

            const x0 = Math.floor(gx), x1 = x0 < maxIdx ? x0 + 1 : maxIdx;
            const y0 = Math.floor(gy), y1 = y0 < maxIdx ? y0 + 1 : maxIdx;
            const z0 = Math.floor(gz), z1 = z0 < maxIdx ? z0 + 1 : maxIdx;

            const fx = gx - x0;
            const fy = gy - y0;
            const fz = gz - z0;
            const omx = 1.0 - fx;
            const omy = 1.0 - fy;

            const strideY = VOL_RES;
            const strideZ = VOL_RES * VOL_RES;
            const i000 = (x0 + y0 * strideY + z0 * strideZ) * 4;
            const i100 = (x1 + y0 * strideY + z0 * strideZ) * 4;
            const i010 = (x0 + y1 * strideY + z0 * strideZ) * 4;
            const i110 = (x1 + y1 * strideY + z0 * strideZ) * 4;
            const i001 = (x0 + y0 * strideY + z1 * strideZ) * 4;
            const i101 = (x1 + y0 * strideY + z1 * strideZ) * 4;
            const i011 = (x0 + y1 * strideY + z1 * strideZ) * 4;
            const i111 = (x1 + y1 * strideY + z1 * strideZ) * 4;

            const d00 = volumeData[i000] * omx + volumeData[i100] * fx;
            const d10 = volumeData[i010] * omx + volumeData[i110] * fx;
            const d01 = volumeData[i001] * omx + volumeData[i101] * fx;
            const d11 = volumeData[i011] * omx + volumeData[i111] * fx;
            const d0 = d00 * omy + d10 * fy;
            const d1 = d01 * omy + d11 * fy;
            return (d0 * (1.0 - fz) + d1 * fz) * DOMAIN_HALF;
        }

        // CPU Trilinear Interpolation Sampling (Exact match with GPU sampler3D texel centers)
        function cpuSampleSDF(wx, wy, wz) {
            const invSpan = 1.0 / (DOMAIN_HALF * 2.0);
            const u = (wx + DOMAIN_HALF) * invSpan;
            const v = (wy + DOMAIN_HALF) * invSpan;
            const w = (wz + DOMAIN_HALF) * invSpan;

            if (u < 0 || u > 1 || v < 0 || v > 1 || w < 0 || w > 1) {
                return { d: 1000.0, ore: 0.0, armor: 0.0, mat: 0 };
            }

            const maxIdx = VOL_RES - 1;
            const gx = Math.max(0, Math.min(maxIdx, u * VOL_RES - 0.5));
            const gy = Math.max(0, Math.min(maxIdx, v * VOL_RES - 0.5));
            const gz = Math.max(0, Math.min(maxIdx, w * VOL_RES - 0.5));

            const x0 = Math.floor(gx), x1 = x0 < maxIdx ? x0 + 1 : maxIdx;
            const y0 = Math.floor(gy), y1 = y0 < maxIdx ? y0 + 1 : maxIdx;
            const z0 = Math.floor(gz), z1 = z0 < maxIdx ? z0 + 1 : maxIdx;

            const fx = gx - x0;
            const fy = gy - y0;
            const fz = gz - z0;
            const omx = 1.0 - fx;
            const omy = 1.0 - fy;
            const omz = 1.0 - fz;

            const strideY = VOL_RES;
            const strideZ = VOL_RES * VOL_RES;
            const i000 = (x0 + y0 * strideY + z0 * strideZ) * 4;
            const i100 = (x1 + y0 * strideY + z0 * strideZ) * 4;
            const i010 = (x0 + y1 * strideY + z0 * strideZ) * 4;
            const i110 = (x1 + y1 * strideY + z0 * strideZ) * 4;
            const i001 = (x0 + y0 * strideY + z1 * strideZ) * 4;
            const i101 = (x1 + y0 * strideY + z1 * strideZ) * 4;
            const i011 = (x0 + y1 * strideY + z1 * strideZ) * 4;
            const i111 = (x1 + y1 * strideY + z1 * strideZ) * 4;

            // Interpolate continuous signed distance d
            const d00 = volumeData[i000] * omx + volumeData[i100] * fx;
            const d10 = volumeData[i010] * omx + volumeData[i110] * fx;
            const d01 = volumeData[i001] * omx + volumeData[i101] * fx;
            const d11 = volumeData[i011] * omx + volumeData[i111] * fx;
            const d = ((d00 * omy + d10 * fy) * omz + (d01 * omy + d11 * fy) * fz) * DOMAIN_HALF;

            // Interpolate continuous ore vein mask
            const o00 = volumeData[i000 + 1] * omx + volumeData[i100 + 1] * fx;
            const o10 = volumeData[i010 + 1] * omx + volumeData[i110 + 1] * fx;
            const o01 = volumeData[i001 + 1] * omx + volumeData[i101 + 1] * fx;
            const o11 = volumeData[i011 + 1] * omx + volumeData[i111 + 1] * fx;
            const ore = (o00 * omy + o10 * fy) * omz + (o01 * omy + o11 * fy) * fz;

            // Interpolate continuous titanium armor mask
            const a00 = volumeData[i000 + 2] * omx + volumeData[i100 + 2] * fx;
            const a10 = volumeData[i010 + 2] * omx + volumeData[i110 + 2] * fx;
            const a01 = volumeData[i001 + 2] * omx + volumeData[i101 + 2] * fx;
            const a11 = volumeData[i011 + 2] * omx + volumeData[i111 + 2] * fx;
            const armor = (a00 * omy + a10 * fy) * omz + (a01 * omy + a11 * fy) * fz;

            return {
                d,
                ore,
                armor,
                mat: armor >= 0.35 ? 3 : (ore >= 0.45 ? 2 : 1)
            };
        }

        // Setup Raymarching Volume Mesh
        function setupRaymarcher(scene) {
            if (sandbox && sandbox.renderer) {
                const gl = sandbox.renderer.getContext();
                if (gl) {
                    gl.getExtension('OES_texture_float_linear');
                    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                    const rendererStr = dbg
                        ? (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || gl.getParameter(gl.RENDERER) || '')
                        : (gl.getParameter(gl.RENDERER) || '');
                    isSoftwareGL = /SwiftShader|llvmpipe|Software/i.test(String(rendererStr));
                } else {
                    isSoftwareGL = Boolean(sandbox.isSoftwareGL);
                }
            }
            useHalfFloat = !isSoftwareGL;

            initVolumeField();

            const boxGeo = new THREE.BoxGeometry(DOMAIN_HALF * 2, DOMAIN_HALF * 2, DOMAIN_HALF * 2);

            raymarchMaterial = new THREE.ShaderMaterial({
                glslVersion: THREE.GLSL3,
                uniforms: {
                    uVolume: { value: volumeTexture },
                    uVolRes: { value: VOL_RES },
                    uDomainHalf: { value: DOMAIN_HALF },
                    uAsteroidRadius: { value: currentRadius },
                    uSunDir: { value: new THREE.Vector3(0.65, 0.55, 0.52).normalize() },
                    uCameraPos: { value: new THREE.Vector3() },
                    uViewProjMatrix: { value: new THREE.Matrix4() },
                    uWireframe: { value: 0.0 },
                    uXRayEnabled: { value: 0.0 },
                    uXRayOffset: { value: 0.0 },
                    uMaxSteps: { value: isSoftwareGL ? 48 : 96 }
                },
                vertexShader: `
                    out vec3 vWorldPos;
                    void main() {
                        vec4 wp = modelMatrix * vec4(position, 1.0);
                        vWorldPos = wp.xyz;
                        gl_Position = projectionMatrix * viewMatrix * wp;
                    }
                `,
                fragmentShader: `
                    precision highp float;
                    precision highp sampler3D;

                    in vec3 vWorldPos;
                    out vec4 fragColor;

                    uniform sampler3D uVolume;
                    uniform float uVolRes;
                    uniform float uDomainHalf;
                    uniform float uAsteroidRadius;
                    uniform vec3 uSunDir;
                    uniform vec3 uCameraPos;
                    uniform mat4 uViewProjMatrix;
                    uniform float uWireframe;
                    uniform float uXRayEnabled;
                    uniform float uXRayOffset;
                    uniform int uMaxSteps;

                    float rmHash3(vec3 p) {
                        p = fract(p * 0.3183099 + 0.1);
                        p *= 17.0;
                        return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                    }

                    float rmNoise3(vec3 x) {
                        vec3 i = floor(x);
                        vec3 f = fract(x);
                        f = f * f * (3.0 - 2.0 * f);
                        return mix(
                            mix(mix(rmHash3(i + vec3(0,0,0)), rmHash3(i + vec3(1,0,0)), f.x),
                                mix(rmHash3(i + vec3(0,1,0)), rmHash3(i + vec3(1,1,0)), f.x), f.y),
                            mix(mix(rmHash3(i + vec3(0,0,1)), rmHash3(i + vec3(1,0,1)), f.x),
                                mix(rmHash3(i + vec3(0,1,1)), rmHash3(i + vec3(1,1,1)), f.x), f.y),
                            f.z
                        );
                    }

                    float rmFbm(vec3 p) {
                        float v = 0.0;
                        float a = 0.5;
                        for (int i = 0; i < 3; i++) {
                            v += a * rmNoise3(p);
                            p *= 2.04;
                            a *= 0.5;
                        }
                        return v;
                    }

                    float rmHexDist2D(vec2 p) {
                        p = abs(p);
                        return max(dot(p, normalize(vec2(1.0, 1.7320508))), p.x);
                    }

                    float rmTriplanarHex(vec3 pos, vec3 n, float scale) {
                        vec3 w = pow(abs(n), vec3(4.0));
                        w /= max(w.x + w.y + w.z, 0.0001);
                        float h = 0.0;
                        vec2 uv0 = pos.yz * scale;
                        vec2 uv1 = pos.xz * scale;
                        vec2 uv2 = pos.xy * scale;
                        for (int i = 0; i < 3; i++) {
                            vec2 uv = (i == 0) ? uv0 : ((i == 1) ? uv1 : uv2);
                            float wi = (i == 0) ? w.x : ((i == 1) ? w.y : w.z);
                            vec2 r = vec2(1.0, 1.7320508);
                            vec2 h2 = r * 0.5;
                            vec2 a = mod(uv, r) - h2;
                            vec2 b = mod(uv - h2, r) - h2;
                            vec2 gv = dot(a, a) < dot(b, b) ? a : b;
                            float edge = 0.5 - rmHexDist2D(gv);
                            h += smoothstep(0.0, 0.065, edge) * wi;
                        }
                        return h;
                    }

                    vec2 intersectBox(vec3 orig, vec3 dir, vec3 bmin, vec3 bmax) {
                        vec3 safeDir = vec3(
                            abs(dir.x) < 1e-6 ? 1e-6 : dir.x,
                            abs(dir.y) < 1e-6 ? 1e-6 : dir.y,
                            abs(dir.z) < 1e-6 ? 1e-6 : dir.z
                        );
                        vec3 invDir = 1.0 / safeDir;
                        vec3 t0s = (bmin - orig) * invDir;
                        vec3 t1s = (bmax - orig) * invDir;
                        vec3 tsmaller = min(t0s, t1s);
                        vec3 tbigger = max(t0s, t1s);
                        return vec2(
                            max(max(tsmaller.x, tsmaller.y), tsmaller.z),
                            min(min(tbigger.x, tbigger.y), tbigger.z)
                        );
                    }

                    // 1-Tap Fast Hardware Trilinear Sampling (returns vec3(d, ore, armor))
                    vec3 sampleVolumeFast(vec3 localPos) {
                        vec3 uv = (localPos + uDomainHalf) / (uDomainHalf * 2.0);
                        vec4 samp = texture(uVolume, clamp(uv, vec3(0.0), vec3(1.0)));
                        return vec3(samp.r * uDomainHalf, samp.g, samp.b);
                    }

                    // Sigg & Hadwiger GPU Gems 2 Ch. 20: 8-tap hardware trilinear C2 Tricubic B-Spline interpolation
                    vec3 sampleVolumeBspline(vec3 localPos) {
                        vec3 uv = clamp((localPos + uDomainHalf) / (uDomainHalf * 2.0), vec3(0.0), vec3(1.0));
                        vec3 coord = uv * uVolRes - 0.5;
                        vec3 index = floor(coord);
                        vec3 fraction = coord - index;

                        vec3 one_frac = 1.0 - fraction;
                        vec3 one_frac2 = one_frac * one_frac;
                        vec3 fraction2 = fraction * fraction;

                        vec3 w0 = (1.0 / 6.0) * one_frac2 * one_frac;
                        vec3 w1 = (2.0 / 3.0) - 0.5 * fraction2 * (2.0 - fraction);
                        vec3 w2 = (2.0 / 3.0) - 0.5 * one_frac2 * (2.0 - one_frac);
                        vec3 w3 = (1.0 / 6.0) * fraction2 * fraction;

                        vec3 g0 = w0 + w1;
                        vec3 g1 = w2 + w3;
                        // h0 and h1 are already in texel-center coordinates (texel k at k + 0.5)
                        vec3 h0 = (w1 / max(g0, vec3(1e-5))) - 0.5 + index;
                        vec3 h1 = (w3 / max(g1, vec3(1e-5))) + 1.5 + index;

                        vec3 texCoord0 = clamp(h0 / uVolRes, vec3(0.5 / uVolRes), vec3(1.0 - 0.5 / uVolRes));
                        vec3 texCoord1 = clamp(h1 / uVolRes, vec3(0.5 / uVolRes), vec3(1.0 - 0.5 / uVolRes));

                        vec4 tex000 = texture(uVolume, vec3(texCoord0.x, texCoord0.y, texCoord0.z));
                        vec4 tex100 = texture(uVolume, vec3(texCoord1.x, texCoord0.y, texCoord0.z));
                        vec4 tex010 = texture(uVolume, vec3(texCoord0.x, texCoord1.y, texCoord0.z));
                        vec4 tex110 = texture(uVolume, vec3(texCoord1.x, texCoord1.y, texCoord0.z));
                        vec4 tex001 = texture(uVolume, vec3(texCoord0.x, texCoord0.y, texCoord1.z));
                        vec4 tex101 = texture(uVolume, vec3(texCoord1.x, texCoord0.y, texCoord1.z));
                        vec4 tex011 = texture(uVolume, vec3(texCoord0.x, texCoord1.y, texCoord1.z));
                        vec4 tex111 = texture(uVolume, vec3(texCoord1.x, texCoord1.y, texCoord1.z));

                        vec3 blend = g1;

                        vec4 tex00 = mix(tex000, tex100, blend.x);
                        vec4 tex10 = mix(tex010, tex110, blend.x);
                        vec4 tex01 = mix(tex001, tex101, blend.x);
                        vec4 tex11 = mix(tex011, tex111, blend.x);

                        vec4 tex0 = mix(tex00, tex10, blend.y);
                        vec4 tex1 = mix(tex01, tex11, blend.y);

                        vec4 res = mix(tex0, tex1, blend.z);
                        return vec3(res.x * uDomainHalf, res.y, res.z);
                    }

                    // Continuous C2 Tetrahedral Gradient using Tricubic B-Spline SDF
                    vec3 calcNormalRaw(vec3 p) {
                        float voxelSize = (uDomainHalf * 2.0) / uVolRes;
                        float eps = voxelSize * 0.35;
                        vec2 e = vec2(eps, -eps);
                        vec3 gradSum =
                            e.xyy * sampleVolumeBspline(p + e.xyy).x +
                            e.yyx * sampleVolumeBspline(p + e.yyx).x +
                            e.yxy * sampleVolumeBspline(p + e.yxy).x +
                            e.xxx * sampleVolumeBspline(p + e.xxx).x;
                        return gradSum / (4.0 * eps * eps);
                    }

                    // 4-Tap SDF Cavity Ambient Occlusion along outward normal
                    float calcCavityAO(vec3 pos, vec3 nor) {
                        float voxelSize = (uDomainHalf * 2.0) / uVolRes;
                        float occ = 0.0;
                        float weight = 1.0;
                        for (int i = 1; i <= 4; i++) {
                            float h = float(i) * voxelSize * 0.85;
                            float d = sampleVolumeFast(pos + nor * h).x;
                            occ += clamp((h - d) / h, 0.0, 1.0) * weight;
                            weight *= 0.5;
                        }
                        return clamp(1.0 - occ * 0.45, 0.25, 1.0);
                    }

                    void main() {
                        vec3 ro = uCameraPos;
                        vec3 rd = normalize(vWorldPos - ro);

                        vec2 tBox = intersectBox(ro, rd, vec3(-uDomainHalf), vec3(uDomainHalf));
                        if (tBox.y < max(tBox.x, 0.0)) discard;

                        float t = max(tBox.x, 0.0);
                        float tEnd = tBox.y;

                        // Analytical Bounding-Sphere Early-Out
                        float rBound = uAsteroidRadius * 1.25;
                        float bSph = dot(ro, rd);
                        float cSph = dot(ro, ro) - rBound * rBound;
                        float dSph = bSph * bSph - cSph;
                        if (dSph < 0.0) discard;
                        float sqrtD = sqrt(dSph);
                        float ts0 = -bSph - sqrtD;
                        float ts1 = -bSph + sqrtD;
                        if (ts1 < 0.0) discard;
                        t = max(t, max(ts0, 0.0)) + 0.5;
                        tEnd = min(tEnd, ts1);
                        if (tEnd < t) discard;

                        bool hitSliceCap = false;
                        if (uXRayEnabled > 0.5) {
                            float sliceY = -uXRayOffset;
                            if ((ro + rd * t).y > sliceY) {
                                if (rd.y >= -1e-5) discard;
                                float tPlane = (sliceY - ro.y) / rd.y;
                                if (tPlane > tEnd) discard;
                                t = max(t, tPlane);
                                hitSliceCap = true;
                            }
                        }

                        float voxelSize = (uDomainHalf * 2.0) / uVolRes;
                        float minStep = max(uAsteroidRadius * 0.001, 1.5);
                        vec3 p = ro + rd * t;
                        bool hit = false;
                        float prevT = t;

                        for (int i = 0; i < 96; i++) {
                            if (i >= uMaxSteps) break;
                            if (t > tEnd) break;
                            p = ro + rd * t;

                            float dist = sampleVolumeFast(p).x;

                            if (dist <= 0.0) {
                                hit = true;
                                if (i == 0 && hitSliceCap) {
                                    // Ray hit solid interior right on the X-Ray slice plane
                                    break;
                                }
                                // 5-iteration fast root bisection using 1-tap sampleVolumeFast
                                float a = prevT;
                                float b = t;
                                for (int k = 0; k < 5; k++) {
                                    float m = 0.5 * (a + b);
                                    float dm = sampleVolumeFast(ro + rd * m).x;
                                    if (dm <= 0.0) b = m;
                                    else a = m;
                                }
                                t = 0.5 * (a + b);
                                p = ro + rd * t;
                                hitSliceCap = false;
                                break;
                            }

                            prevT = t;
                            t += max(dist * 0.90, minStep * (1.0 + float(i) * 0.05));
                        }

                        if (!hit) {
                            discard;
                        }

                        vec3 norm;
                        vec3 sampleRes;
                        if (hitSliceCap) {
                            norm = vec3(0.0, 1.0, 0.0);
                            sampleRes = sampleVolumeBspline(p);
                        } else {
                            vec3 rawGrad = calcNormalRaw(p);
                            float rawLenSq = dot(rawGrad, rawGrad);
                            norm = rawLenSq > 1e-10 ? rawGrad * inversesqrt(rawLenSq) : normalize(p);
                            sampleRes = sampleVolumeBspline(p);
                            float denom = dot(rawGrad, rd);
                            if (denom < -0.15) {
                                t = max(0.0, t + clamp(-sampleRes.x / denom, -voxelSize * 0.45, voxelSize * 0.45));
                                p = ro + rd * t;
                                sampleRes = sampleVolumeBspline(p);
                            }
                        }

                        float camDist = length(p - ro);
                        float invScale = 2800.0 / uAsteroidRadius;
                        vec3 sp = p * invScale;

                        float fbmMacro = rmFbm(sp * 0.006);
                        float fbmMed = rmFbm(sp * 0.015);
                        float fbmMicro = rmFbm(sp * 0.032);
                        float fbmGrit = rmNoise3(sp * 0.088);

                        vec3 finalVol = sampleRes;
                        float oreWeight = clamp(finalVol.y, 0.0, 1.0);
                        float armorWeight = smoothstep(0.32, 0.68, finalVol.z);

                        // Lightweight 3-tap single-octave procedural bump (zero dFdx silhouette artifacts)
                        float distAtten = clamp((uAsteroidRadius * 1.95) / max(camDist, uAsteroidRadius * 0.3), 0.35, 1.0);
                        if (!hitSliceCap && armorWeight < 0.35) {
                            float epsB = clamp((camDist * invScale) * 0.00055, 0.45, 1.9);
                            vec3 spB = sp * 0.045;
                            float dEpsB = epsB * 0.045;
                            float bumpC = rmNoise3(spB);
                            float hx = rmNoise3(spB + vec3(dEpsB, 0.0, 0.0)) - bumpC;
                            float hy = rmNoise3(spB + vec3(0.0, dEpsB, 0.0)) - bumpC;
                            float hz = rmNoise3(spB + vec3(0.0, 0.0, dEpsB)) - bumpC;
                            vec3 bumpGrad = vec3(hx, hy, hz) / epsB;
                            bumpGrad -= norm * dot(bumpGrad, norm);
                            norm = normalize(norm - bumpGrad * (9.5 * distAtten * (1.0 - armorWeight)));
                        }

                        // Cavity Ambient Occlusion
                        float ao = hitSliceCap ? 0.92 : calcCavityAO(p, norm);

                        // High-contrast geological lighting parity with Options 1–3
                        float sunDiff = max(dot(norm, uSunDir), 0.0);
                        float fillDiff = max(dot(norm, normalize(vec3(-0.6, -0.4, -0.5))), 0.0);
                        float camLight = max(dot(norm, -rd), 0.0) * 0.13;
                        vec3 ambientCol = vec3(0.20, 0.24, 0.30) * ao;
                        vec3 directLight = vec3(1.0, 0.97, 0.91) * (sunDiff * 1.32) + vec3(0.45, 0.62, 0.85) * (fillDiff * 0.38) + vec3(0.85, 0.94, 1.0) * (camLight * ao);

                        // Rock colors with tactile granular grit and organic geological strata
                        float strata = 0.5 + 0.5 * sin(length(sp) * 0.018 + fbmMacro * 9.5 + fbmMed * 3.5);
                        float depthShade = smoothstep(uAsteroidRadius * 0.25, uAsteroidRadius * 1.05, length(p));
                        float grain = mix(fbmMicro, fbmMicro * 0.65 + fbmGrit * 0.35, distAtten);
                        vec3 exteriorRock = mix(vec3(0.28, 0.30, 0.34), vec3(0.56, 0.54, 0.50), fbmMacro * 0.65 + grain * 0.45);
                        vec3 interiorRock = mix(vec3(0.21, 0.24, 0.31), vec3(0.39, 0.36, 0.34), strata * 0.42 + grain * 0.55);
                        vec3 baseCol = mix(interiorRock, exteriorRock, depthShade) * (0.82 + 0.34 * grain);
                        vec3 emissiveCol = vec3(0.0);

                        // Mineral Ore Veins (exposed inside carved craters & tunnels)
                        float oreMask = 0.0;
                        if (oreWeight > 0.02) {
                            oreMask = oreWeight * smoothstep(0.32, 0.72, grain + 0.2 * fbmMed);
                            vec3 oreCol = mix(vec3(0.75, 0.48, 0.12), vec3(1.0, 0.82, 0.28), grain);
                            baseCol = mix(baseCol, oreCol, oreMask * 0.90);
                            emissiveCol += vec3(0.22, 0.11, 0.02) * grain * oreMask;
                        }

                        // Reinforced Titanium Bulkheads
                        float spec = 0.0;
                        if (armorWeight > 0.02) {
                            float hexMask = rmTriplanarHex(sp, norm, 0.032);
                            vec3 plate = mix(vec3(0.12, 0.20, 0.28), vec3(0.24, 0.35, 0.46), grain * 0.5);
                            vec3 seam = vec3(0.0, 0.92, 1.0);
                            vec3 armorCol = mix(seam, plate, hexMask);
                            baseCol = mix(baseCol, armorCol, armorWeight);
                            vec3 halfVec = normalize(uSunDir - rd);
                            float specPow = mix(16.0, 48.0, armorWeight);
                            float specStrength = mix(0.05, 0.72, armorWeight) + oreMask * 0.25;
                            spec = pow(max(dot(norm, halfVec), 0.0), specPow) * specStrength;
                            emissiveCol += (vec3(0.0, 0.72, 0.95) * (1.0 - hexMask) * 1.1 + vec3(0.02, 0.10, 0.16)) * armorWeight;
                        }

                        vec3 finalColor = baseCol * (ambientCol + directLight) + vec3(spec) * (0.5 + 0.5 * ao) + emissiveCol;

                        if (uWireframe > 0.5) {
                            vec3 grid = abs(fract(p / voxelSize - 0.5) - 0.5) / 0.08;
                            float line = 1.0 - min(min(grid.x, min(grid.y, grid.z)), 1.0);
                            finalColor = mix(finalColor, vec3(0.1, 0.95, 0.8), line * 0.75);
                        }

                        vec4 clipPos = uViewProjMatrix * vec4(p, 1.0);
                        gl_FragDepth = (clipPos.z / clipPos.w) * 0.5 + 0.5;
                        fragColor = vec4(finalColor, 1.0);
                    }
                `,
                side: THREE.BackSide,
                transparent: false,
                depthWrite: true
            });

            volumeBoxMesh = new THREE.Mesh(boxGeo, raymarchMaterial);
            volumeBoxMesh.frustumCulled = false;
            scene.add(volumeBoxMesh);
        }

        function carveSpherePoC4(hitPoint, brushRadius, mode = 'carve') {
            let modified = false;
            const pad = brushRadius + VOXEL_SPACING * 1.5;
            const minX = Math.max(0, Math.floor(((hitPoint.x - pad) + DOMAIN_HALF) / VOXEL_SPACING));
            const maxX = Math.min(VOL_RES - 1, Math.ceil(((hitPoint.x + pad) + DOMAIN_HALF) / VOXEL_SPACING));
            const minY = Math.max(0, Math.floor(((hitPoint.y - pad) + DOMAIN_HALF) / VOXEL_SPACING));
            const maxY = Math.min(VOL_RES - 1, Math.ceil(((hitPoint.y + pad) + DOMAIN_HALF) / VOXEL_SPACING));
            const minZ = Math.max(0, Math.floor(((hitPoint.z - pad) + DOMAIN_HALF) / VOXEL_SPACING));
            const maxZ = Math.min(VOL_RES - 1, Math.ceil(((hitPoint.z + pad) + DOMAIN_HALF) / VOXEL_SPACING));

            let dMinX = maxX, dMaxX = minX, dMinY = maxY, dMaxY = minY, dMinZ = maxZ, dMaxZ = minZ;
            const volRes2 = VOL_RES * VOL_RES;
            for (let z = minZ; z <= maxZ; z++) {
                const wz = -DOMAIN_HALF + (z + 0.5) * VOXEL_SPACING;
                const zOff = z * volRes2;
                for (let y = minY; y <= maxY; y++) {
                    const wy = -DOMAIN_HALF + (y + 0.5) * VOXEL_SPACING;
                    const yzOff = zOff + y * VOL_RES;
                    for (let x = minX; x <= maxX; x++) {
                        const wx = -DOMAIN_HALF + (x + 0.5) * VOXEL_SPACING;
                        const distToHit = Math.hypot(wx - hitPoint.x, wy - hitPoint.y, wz - hitPoint.z);
                        const idx4 = (x + yzOff) * 4;
                        let cellModified = false;

                        // Heavy Breach Mode clears armor plating
                        if (mode === 'breach' && distToHit <= brushRadius + VOXEL_SPACING * 0.85) {
                            if (volumeData[idx4 + 2] > 0.0) {
                                volumeData[idx4 + 2] = 0.0;
                                cellModified = true;
                            }
                        }

                        if (distToHit <= brushRadius + VOXEL_SPACING * 0.5) {
                            const curD = volumeData[idx4] * DOMAIN_HALF;
                            const carveD = brushRadius - distToHit;
                            if (carveD > curD) {
                                volumeData[idx4] = carveD / DOMAIN_HALF;
                                cellModified = true;
                            }
                            // Deep interior void clears residual armor and ore masks
                            if (carveD > VOXEL_SPACING * 1.85) {
                                if (volumeData[idx4 + 1] !== 0.0 || volumeData[idx4 + 2] !== 0.0) {
                                    volumeData[idx4 + 1] = 0.0;
                                    volumeData[idx4 + 2] = 0.0;
                                    cellModified = true;
                                }
                            }
                        }

                        if (cellModified) {
                            modified = true;
                            if (x < dMinX) dMinX = x;
                            if (x > dMaxX) dMaxX = x;
                            if (y < dMinY) dMinY = y;
                            if (y > dMaxY) dMaxY = y;
                            if (z < dMinZ) dMinZ = z;
                            if (z > dMaxZ) dMaxZ = z;
                        }
                    }
                }
            }
            if (modified && volumeTexture) {
                uploadVolumeSubBox(dMinX, dMaxX, dMinY, dMaxY, dMinZ, dMaxZ);
            }
        }

        function reinforceSpherePoC4(hitPoint, brushRadius) {
            let modified = false;
            const effRadius = brushRadius + VOXEL_SPACING * 0.55;
            const pad = effRadius + VOXEL_SPACING * 1.5;
            const minX = Math.max(0, Math.floor(((hitPoint.x - pad) + DOMAIN_HALF) / VOXEL_SPACING));
            const maxX = Math.min(VOL_RES - 1, Math.ceil(((hitPoint.x + pad) + DOMAIN_HALF) / VOXEL_SPACING));
            const minY = Math.max(0, Math.floor(((hitPoint.y - pad) + DOMAIN_HALF) / VOXEL_SPACING));
            const maxY = Math.min(VOL_RES - 1, Math.ceil(((hitPoint.y + pad) + DOMAIN_HALF) / VOXEL_SPACING));
            const minZ = Math.max(0, Math.floor(((hitPoint.z - pad) + DOMAIN_HALF) / VOXEL_SPACING));
            const maxZ = Math.min(VOL_RES - 1, Math.ceil(((hitPoint.z + pad) + DOMAIN_HALF) / VOXEL_SPACING));

            let dMinX = maxX, dMaxX = minX, dMinY = maxY, dMaxY = minY, dMinZ = maxZ, dMaxZ = minZ;
            const volRes2 = VOL_RES * VOL_RES;
            for (let z = minZ; z <= maxZ; z++) {
                const wz = -DOMAIN_HALF + (z + 0.5) * VOXEL_SPACING;
                const zOff = z * volRes2;
                for (let y = minY; y <= maxY; y++) {
                    const wy = -DOMAIN_HALF + (y + 0.5) * VOXEL_SPACING;
                    const yzOff = zOff + y * VOL_RES;
                    for (let x = minX; x <= maxX; x++) {
                        const wx = -DOMAIN_HALF + (x + 0.5) * VOXEL_SPACING;
                        const distToHit = Math.hypot(wx - hitPoint.x, wy - hitPoint.y, wz - hitPoint.z);
                        if (distToHit <= effRadius) {
                            const idx4 = (x + yzOff) * 4;
                            const curD = volumeData[idx4] * DOMAIN_HALF;
                            // Cover immediate void boundary layer across d=0 so B-spline evaluates solid armor inside concave cavities
                            if (curD <= VOXEL_SPACING * 0.90 && curD >= -(brushRadius + VOXEL_SPACING * 1.5)) {
                                if (volumeData[idx4 + 2] !== 1.0 || volumeData[idx4 + 1] !== 0.0) {
                                    volumeData[idx4 + 2] = 1.0;
                                    volumeData[idx4 + 1] = 0.0;
                                    modified = true;
                                    if (x < dMinX) dMinX = x;
                                    if (x > dMaxX) dMaxX = x;
                                    if (y < dMinY) dMinY = y;
                                    if (y > dMaxY) dMaxY = y;
                                    if (z < dMinZ) dMinZ = z;
                                    if (z > dMaxZ) dMaxZ = z;
                                }
                            }
                        }
                    }
                }
            }
            if (modified && volumeTexture) {
                uploadVolumeSubBox(dMinX, dMaxX, dMinY, dMaxY, dMinZ, dMaxZ);
            }
        }

        function applyQualityPoC4(qualityKey) {
            VOL_RES = QUALITY_PRESETS_POC4[qualityKey] || 112;
            VOXEL_SPACING = (DOMAIN_HALF * 2.0) / VOL_RES;
        }

        function createStarterTunnelPoC4() {
            const tunnelDir = new THREE.Vector3(0.14, 0.12, 1.0).normalize();
            const surfPt = findSurfacePoint(evalDensityPoC4, tunnelDir, currentRadius * 0.6, currentRadius * 1.4);
            const scaleFactor = currentRadius / 2800.0;
            const mouthPt = surfPt.clone().addScaledVector(tunnelDir, -15 * scaleFactor);
            const innerPt = surfPt.clone().addScaledVector(tunnelDir, -215 * scaleFactor);
            carveSpherePoC4(mouthPt, 220 * scaleFactor, 'carve');
            carveSpherePoC4(innerPt, 200 * scaleFactor, 'carve');
            reinforceSpherePoC4(innerPt, 212 * scaleFactor);
        }

        function rebuildVolumePoC4() {
            initVolumeField();
            if (volumeBoxMesh && raymarchMaterial) {
                volumeBoxMesh.geometry.dispose();
                volumeBoxMesh.geometry = new THREE.BoxGeometry(DOMAIN_HALF * 2, DOMAIN_HALF * 2, DOMAIN_HALF * 2);
                raymarchMaterial.uniforms.uDomainHalf.value = DOMAIN_HALF;
                raymarchMaterial.uniforms.uAsteroidRadius.value = currentRadius;
                raymarchMaterial.uniforms.uVolRes.value = VOL_RES;
                raymarchMaterial.uniforms.uVolume.value = volumeTexture;
            }
            createStarterTunnelPoC4();
        }

        // Shared Sandbox Setup
        const sandbox = new PlanetaryBaseSandbox({
            pocId: 'poc4',
            pocTitle: 'Option 4: 3D GPU SDF Raymarching',
            defaultRadius: currentRadius,
            hasLocalCollisionMesh: false,
            getCollisionMesh: () => null,
            getVisualMesh: () => volumeBoxMesh,
            getCellSize: () => `${VOXEL_SPACING.toFixed(1)}u (${VOL_RES}³)`,
            onBeforeRender: () => {
                if (raymarchMaterial) {
                    sandbox.camera.updateMatrixWorld();
                    viewProjMatrix.multiplyMatrices(sandbox.camera.projectionMatrix, sandbox.camera.matrixWorldInverse);
                    raymarchMaterial.uniforms.uCameraPos.value.copy(sandbox.camera.position);
                    raymarchMaterial.uniforms.uViewProjMatrix.value.copy(viewProjMatrix);
                    raymarchMaterial.uniforms.uXRayEnabled.value = sandbox.isXRay ? 1.0 : 0.0;
                    raymarchMaterial.uniforms.uXRayOffset.value = sandbox.clipPlane.constant;
                }
            },

            // Analytical CPU Sphere-Marching Raycast (0.00u visual-to-collision parity; supports world-space rays)
            customRaycast: (raycaster, camera, mousePos) => {
                if (camera && mousePos) {
                    raycaster.setFromCamera(mousePos, camera);
                }
                const ro = raycaster.ray.origin;
                const rd = raycaster.ray.direction;
                const nearT = raycaster.near || 0.0;
                const farT = (raycaster.far !== undefined && raycaster.far !== null) ? raycaster.far : Infinity;

                // Intersect ray with volume AABB before sphere-marching
                _rcBoxMin.set(-DOMAIN_HALF, -DOMAIN_HALF, -DOMAIN_HALF);
                _rcBoxMax.set(DOMAIN_HALF, DOMAIN_HALF, DOMAIN_HALF);
                _rcBox.set(_rcBoxMin, _rcBoxMax);
                const insideBox = _rcBox.containsPoint(ro);
                if (!insideBox && !raycaster.ray.intersectBox(_rcBox, _rcEntryPt)) {
                    return null;
                }
                let t = Math.max(nearT, insideBox ? 0.0 : ro.distanceTo(_rcEntryPt) + 1.0);

                // Analytical Bounding-Sphere Early-Out (matches GPU shader)
                const rBound = currentRadius * 1.25;
                const bSph = ro.dot(rd);
                const cSph = ro.lengthSq() - rBound * rBound;
                const dSph = bSph * bSph - cSph;
                if (dSph < 0.0) return null;
                const sqrtD = Math.sqrt(dSph);
                const ts0 = -bSph - sqrtD;
                const ts1 = -bSph + sqrtD;
                if (ts1 < nearT) return null;
                if (ts0 > 0.0) t = Math.max(t, ts0 + 0.5);
                const maxT = Math.min(ts1, farT);
                if (maxT < t) return null;

                let prevT = t;
                const minStep = Math.max(currentRadius * 0.001, 1.5);
                let testedMaxT = false;

                for (let step = 0; step < 96; step++) {
                    _rcP.copy(ro).addScaledVector(rd, t);
                    if (sandbox.isXRay && _rcP.y > -sandbox.xRayOffset) {
                        if (rd.y >= -1e-5) return null;
                        const tPlane = (-sandbox.xRayOffset - ro.y) / rd.y;
                        if (tPlane > maxT) return null;
                        t = Math.max(t + 1.0, tPlane);
                        if (t > maxT) {
                            if (testedMaxT) break;
                            t = maxT;
                            testedMaxT = true;
                        }
                        prevT = t;
                        continue;
                    }
                    const d = cpuSampleSDFDistance(_rcP.x, _rcP.y, _rcP.z);
                    if (d <= 0.0) {
                        let a = prevT, b = t;
                        for (let k = 0; k < 5; k++) {
                            const m = 0.5 * (a + b);
                            _rcMp.copy(ro).addScaledVector(rd, m);
                            if (cpuSampleSDFDistance(_rcMp.x, _rcMp.y, _rcMp.z) <= 0.0) b = m;
                            else a = m;
                        }
                        const refinedT = 0.5 * (a + b);
                        if (refinedT < nearT || refinedT > farT) return null;
                        _rcP.copy(ro).addScaledVector(rd, refinedT);
                        const finalSamp = cpuSampleSDF(_rcP.x, _rcP.y, _rcP.z);
                        const eps = Math.max(10.0, VOXEL_SPACING * 0.45);
                        const norm = new THREE.Vector3(
                            cpuSampleSDFDistance(_rcP.x + eps, _rcP.y, _rcP.z) - cpuSampleSDFDistance(_rcP.x - eps, _rcP.y, _rcP.z),
                            cpuSampleSDFDistance(_rcP.x, _rcP.y + eps, _rcP.z) - cpuSampleSDFDistance(_rcP.x, _rcP.y - eps, _rcP.z),
                            cpuSampleSDFDistance(_rcP.x, _rcP.y, _rcP.z + eps) - cpuSampleSDFDistance(_rcP.x, _rcP.y, _rcP.z - eps)
                        );
                        if (norm.lengthSq() > 1e-8) norm.normalize();
                        else if (_rcP.lengthSq() > 1e-8) norm.copy(_rcP).normalize();
                        else norm.set(0, 1, 0);

                        return {
                            point: _rcP.clone(),
                            normal: norm,
                            distance: refinedT,
                            materialId: Math.round(finalSamp.mat),
                            object: volumeBoxMesh
                        };
                    }
                    if (t >= maxT) break;
                    prevT = t;
                    const stepLen = Math.max(d * 0.90, minStep * (1.0 + step * 0.05));
                    if (t + stepLen > maxT) {
                        if (testedMaxT) break;
                        t = maxT;
                        testedMaxT = true;
                    } else {
                        t += stepLen;
                    }
                }
                return null;
            },

            // Exact SDF Swept-Sphere Collision & 4-Tap Tetrahedral Gradient Push-Out
            resolveSphereCollision: (pos, nextPos, radius) => {
                _colCurPos.copy(pos);
                _colRemDelta.copy(nextPos).sub(pos);
                const dispLen = _colRemDelta.length();
                const substeps = dispLen > 1e-4 ? Math.min(8, Math.max(2, Math.ceil(dispLen / Math.max(radius * 0.5, 4.0)))) : 1;
                const eps = Math.max(4.0, VOXEL_SPACING * 0.30);

                let collided = false;
                let minD = Infinity;
                _colNormal.set(0, 1, 0);
                _colHitPt.set(0, 0, 0);

                for (let s = 0; s < substeps; s++) {
                    const frac = 1.0 / (substeps - s);
                    _colStep.copy(_colRemDelta).multiplyScalar(frac);
                    _colRemDelta.sub(_colStep);
                    _colCurPos.add(_colStep);

                    for (let pass = 0; pass < 2; pass++) {
                        const d = cpuSampleSDFDistance(_colCurPos.x, _colCurPos.y, _colCurPos.z);
                        if (d < radius) {
                            const d0 = cpuSampleSDFDistance(_colCurPos.x + eps, _colCurPos.y - eps, _colCurPos.z - eps);
                            const d1 = cpuSampleSDFDistance(_colCurPos.x - eps, _colCurPos.y - eps, _colCurPos.z + eps);
                            const d2 = cpuSampleSDFDistance(_colCurPos.x - eps, _colCurPos.y + eps, _colCurPos.z - eps);
                            const d3 = cpuSampleSDFDistance(_colCurPos.x + eps, _colCurPos.y + eps, _colCurPos.z + eps);
                            _colGrad.set(
                                d0 - d1 - d2 + d3,
                                -d0 - d1 + d2 + d3,
                                -d0 + d1 - d2 + d3
                            );
                            if (_colGrad.lengthSq() > 1e-10) {
                                _colGrad.normalize();
                            } else if (_colCurPos.lengthSq() > 1e-8) {
                                _colGrad.copy(_colCurPos).normalize();
                            } else {
                                _colGrad.set(0, 1, 0);
                            }

                            _colCurPos.addScaledVector(_colGrad, radius - d + 0.15);
                            const vnRem = _colRemDelta.dot(_colGrad);
                            if (vnRem < 0) {
                                _colRemDelta.addScaledVector(_colGrad, -vnRem);
                            }
                            collided = true;
                            _colNormal.copy(_colGrad);
                            _colHitPt.copy(_colCurPos).addScaledVector(_colGrad, -radius);
                            if (d < minD) minD = d;
                        } else {
                            break;
                        }
                    }
                }

                return {
                    position: _colCurPos,
                    collided,
                    normal: collided ? _colNormal : null,
                    hitPoint: collided ? _colHitPt : null,
                    sdfDistance: minD
                };
            },

            onCarve: async (hitPoint, hitNormal, brushRadius, mode) => {
                carveSpherePoC4(hitPoint, brushRadius, mode);
            },

            onReinforce: async (hitPoint, hitNormal, brushRadius) => {
                reinforceSpherePoC4(hitPoint, brushRadius);
            },

            checkMaterialAtHit: (point, hit) => {
                if (hit && hit.materialId >= 3) return true;
                const sample = cpuSampleSDF(point.x, point.y, point.z);
                return sample.armor >= 0.35;
            },

            onScaleChange: (scaleKey, radius) => {
                currentRadius = radius;
                rebuildVolumePoC4();
            },

            onQualityChange: (qualityKey) => {
                applyQualityPoC4(qualityKey);
                rebuildVolumePoC4();
            },

            onToggleWireframe: (enabled) => {
                if (raymarchMaterial) {
                    raymarchMaterial.uniforms.uWireframe.value = enabled ? 1.0 : 0.0;
                }
            },

            onToggleXRay: (enabled, plane) => {
                if (raymarchMaterial) {
                    raymarchMaterial.uniforms.uXRayEnabled.value = enabled ? 1.0 : 0.0;
                    raymarchMaterial.uniforms.uXRayOffset.value = plane.constant;
                }
            }
        });

        currentRadius = sandbox.currentRadius;
        applyQualityPoC4(sandbox.currentQuality);
        setupRaymarcher(sandbox.scene);

        // Starter tunnel entrance + reinforced titanium wall showcase
        createStarterTunnelPoC4();
        sandbox.updateCellSizeLabel();
    </script>
</body>
