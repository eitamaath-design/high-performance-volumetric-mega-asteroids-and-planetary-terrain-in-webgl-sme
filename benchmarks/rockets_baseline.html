<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rockets Baseline Benchmark - MarchingCubes Volumetric Terrain</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; font-family: monospace; color: #00ffcc; }
        #hud {
            position: absolute; top: 10px; left: 10px; background: rgba(10, 10, 20, 0.88);
            border: 1px solid #00ffcc; padding: 15px; border-radius: 6px; pointer-events: none;
            min-width: 320px; box-shadow: 0 0 15px rgba(0, 255, 204, 0.25);
        }
        h2 { margin: 0 0 10px 0; font-size: 16px; color: #fff; letter-spacing: 1px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .val { color: #ffff00; font-weight: bold; }
        #progress-bar-container { width: 100%; background: #222; height: 8px; margin-top: 10px; border-radius: 4px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #00ffcc; transition: width 0.05s linear; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "../node_modules/three/build/three.module.js",
            "three/addons/": "../node_modules/three/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="hud">
        <h2>Rockets Baseline Benchmark</h2>
        <div class="stat-row"><span>Status:</span><span id="st-status" class="val">Initializing</span></div>
        <div class="stat-row"><span>Frame:</span><span id="st-frame" class="val">0 / 450</span></div>
        <div class="stat-row"><span>FPS / Avg:</span><span id="st-fps" class="val">0 / 0</span></div>
        <div class="stat-row"><span>Frame Time (ms):</span><span id="st-ft" class="val">0.00</span></div>
        <div class="stat-row"><span>Triangles:</span><span id="st-tris" class="val">0</span></div>
        <div class="stat-row"><span>Draw Calls:</span><span id="st-draws" class="val">0</span></div>
        <div class="stat-row"><span>Carve Count:</span><span id="st-carves" class="val">0 / 6</span></div>
        <div class="stat-row"><span>Last Carve Dur:</span><span id="st-carve-dur" class="val">0.00 ms</span></div>
        <div class="stat-row"><span>Heap RAM:</span><span id="st-heap" class="val">N/A</span></div>
        <div id="progress-bar-container"><div id="progress-bar"></div></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

        // --- Fast PRNG & 3D Simplex-Style Noise Matching Rockets ---
        class FastNoise3D {
            constructor(seed = 1337) {
                this.seed = seed;
            }
            hash(x, y, z) {
                let s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + this.seed) * 43758.5453123;
                return s - Math.floor(s);
            }
            noise(x, y, z) {
                const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
                const xd = x - X, yd = y - Y, zd = z - Z;
                const u = xd * xd * (3.0 - 2.0 * xd);
                const v = yd * yd * (3.0 - 2.0 * yd);
                const w = zd * zd * (3.0 - 2.0 * zd);

                const c000 = this.hash(X, Y, Z);
                const c100 = this.hash(X + 1, Y, Z);
                const c010 = this.hash(X, Y + 1, Z);
                const c110 = this.hash(X + 1, Y + 1, Z);
                const c001 = this.hash(X, Y, Z + 1);
                const c101 = this.hash(X + 1, Y, Z + 1);
                const c011 = this.hash(X, Y + 1, Z + 1);
                const c111 = this.hash(X + 1, Y + 1, Z + 1);

                const x00 = c000 * (1 - u) + c100 * u;
                const x10 = c010 * (1 - u) + c110 * u;
                const x01 = c001 * (1 - u) + c101 * u;
                const x11 = c011 * (1 - u) + c111 * u;

                const y0 = x00 * (1 - v) + x10 * v;
                const y1 = x01 * (1 - v) + x11 * v;

                return y0 * (1 - w) + y1 * w;
            }
            fbm(x, y, z, octaves = 3) {
                let val = 0, amp = 0.5, freq = 1.0;
                for (let i = 0; i < octaves; i++) {
                    val += this.noise(x * freq, y * freq, z * freq) * amp;
                    freq *= 2.0;
                    amp *= 0.5;
                }
                return val;
            }
        }

        const R = 2800;
        const RES = 48;
        const ISOLATION = 40.0;
        const ISOSURFACE_SCALE = 0.72;
        const SCALE = R / ISOSURFACE_SCALE; // ~3888.88

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.00012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 10, 50000);
        camera.position.set(0, 1800, 4800);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x222233, 1.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 3.2);
        sunLight.position.set(5000, 8000, 4000);
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x336699, 1.2);
        fillLight.position.set(-5000, -3000, -4000);
        scene.add(fillLight);

        // Triplanar Rock Shader
        function applyTriplanarRockShader(mat, seedOffset = 0) {
            mat.userData = mat.userData || {};
            mat.userData.seedOffset = seedOffset;
            mat.customProgramCacheKey = () => `triplanar_rock_${seedOffset}`;
            mat.onBeforeCompile = (shader) => {
                const seedVecLit = `vec3(${Number(seedOffset * 1.73).toFixed(2)}, ${Number(seedOffset * 2.41).toFixed(2)}, ${Number(seedOffset * 3.19).toFixed(2)})`;

                shader.vertexShader = `
                    varying vec3 vRockLocalPos;
                    varying vec3 vRockWorldPos;
                ` + shader.vertexShader;

                shader.vertexShader = shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `#include <begin_vertex>
                     vRockLocalPos = position;`
                );
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <worldpos_vertex>',
                    `#include <worldpos_vertex>
                     vRockWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz + ${seedVecLit};`
                );

                shader.fragmentShader = `
                    varying vec3 vRockLocalPos;
                    varying vec3 vRockWorldPos;
                    float vRockHeightSignal = 0.0;

                    float rockHash3D(vec3 p) {
                        p = fract(p * 0.3183099 + 0.1);
                        p *= 17.0;
                        return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                    }

                    float rockNoise3D(vec3 x) {
                        vec3 i = floor(x);
                        vec3 f = fract(x);
                        f = f * f * (3.0 - 2.0 * f);
                        return mix(
                            mix(mix(rockHash3D(i + vec3(0,0,0)), rockHash3D(i + vec3(1,0,0)), f.x),
                                mix(rockHash3D(i + vec3(0,1,0)), rockHash3D(i + vec3(1,1,0)), f.x), f.y),
                            mix(mix(rockHash3D(i + vec3(0,0,1)), rockHash3D(i + vec3(1,0,1)), f.x),
                                mix(rockHash3D(i + vec3(0,1,1)), rockHash3D(i + vec3(1,1,1)), f.x), f.y), f.z
                        );
                    }

                    float rockFbmTriplanar(vec3 p) {
                        float v = 0.0;
                        v += rockNoise3D(p) * 0.55;
                        v += rockNoise3D(p * 2.02) * 0.30;
                        return v;
                    }
                ` + shader.fragmentShader;

                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <color_fragment>',
                    `#include <color_fragment>
                     float cDist = length(vViewPosition);
                     float cClose = smoothstep(2400.0, 250.0, cDist);
                     float nMacro = rockFbmTriplanar(vRockWorldPos * 0.005);
                     float nMid = rockFbmTriplanar(vRockWorldPos * 0.020);
                     float nFine = mix(0.45, rockFbmTriplanar(vRockWorldPos * 0.10), cClose);
                     float nRidge = 1.0 - abs(rockNoise3D(vRockWorldPos * 0.011) * 2.0 - 1.0);

                     float rockContrast = clamp(0.62 + (nMacro - 0.45) * 0.55 + (nMid - 0.45) * 0.45 + (nFine - 0.45) * 0.40 + (nRidge - 0.5) * 0.28, 0.32, 1.32);
                     diffuseColor.rgb *= rockContrast;

                     // Subterranean carved tunnel interior strata & mineral veins
                     float rLocal = length(vRockLocalPos);
                     if (rLocal < 0.75) {
                         float depthFactor = clamp((0.75 - rLocal) / 0.22, 0.0, 1.0);
                         float strata = sin(rLocal * 95.0 + nMacro * 8.0) * 0.5 + 0.5;
                         vec3 strataCol = mix(vec3(0.18, 0.20, 0.25), vec3(0.42, 0.36, 0.30), strata);
                         float veinNoise = rockNoise3D(vRockWorldPos * 0.035);
                         float cyanVein = smoothstep(0.74, 0.82, veinNoise);
                         float goldVein = smoothstep(0.24, 0.16, veinNoise);
                         strataCol += cyanVein * vec3(0.15, 0.65, 0.85) + goldVein * vec3(0.75, 0.48, 0.12);
                         diffuseColor.rgb = mix(diffuseColor.rgb, strataCol * rockContrast, depthFactor * 0.75);
                     }
                     vRockHeightSignal = rockContrast;
                    `
                );

                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <normal_fragment_maps>',
                    `#include <normal_fragment_maps>
                     vec3 dPosdx = dFdx(vViewPosition);
                     vec3 dPosdy = dFdy(vViewPosition);
                     float dHdx = dFdx(vRockHeightSignal);
                     float dHdy = dFdy(vRockHeightSignal);
                     vec3 r1 = cross(dPosdy, normal);
                     vec3 r2 = cross(normal, dPosdx);
                     float det = dot(dPosdx, r1);
                     vec3 surfGrad = sign(det) * (dHdx * r1 + dHdy * r2);
                     float bumpScale = mix(1.8, 0.85, smoothstep(250.0, 2400.0, length(vViewPosition)));
                     normal = normalize(normal - surfGrad * (bumpScale / max(abs(det), 1e-4)));
                    `
                );
            };
        }

        // Material & MarchingCubes
        const material = new THREE.MeshStandardMaterial({
            color: 0x8a9299,
            roughness: 0.85,
            metalness: 0.18,
            flatShading: false,
            side: THREE.DoubleSide
        });
        applyTriplanarRockShader(material);

        const mc = new MarchingCubes(RES, material, true, true, 150000);
        mc.scale.set(SCALE, SCALE, SCALE);
        mc.position.set(0, 0, 0);
        scene.add(mc);

        // Fast unit-normalized central difference normal cache computation
        function updateNormalCache(mcObj, minX, maxX, minY, maxY, minZ, maxZ) {
            if (!mcObj || !mcObj.field || !mcObj.normal_cache) return 0;
            const res = mcObj.resolution;
            const x0 = Math.max(1, minX !== undefined ? minX : 1);
            const x1 = Math.min(res - 2, maxX !== undefined ? maxX : res - 2);
            const y0 = Math.max(1, minY !== undefined ? minY : 1);
            const y1 = Math.min(res - 2, maxY !== undefined ? maxY : res - 2);
            const z0 = Math.max(1, minZ !== undefined ? minZ : 1);
            const z1 = Math.min(res - 2, maxZ !== undefined ? maxZ : res - 2);

            let updatedCount = 0;
            for (let z = z0; z <= z1; z++) {
                const zOffset = z * mcObj.size2;
                for (let y = y0; y <= y1; y++) {
                    const yzOffset = zOffset + y * mcObj.size;
                    for (let x = x0; x <= x1; x++) {
                        const q = yzOffset + x;
                        const q3 = q * 3;
                        let nx = mcObj.field[q - 1] - mcObj.field[q + 1];
                        let ny = mcObj.field[q - mcObj.yd] - mcObj.field[q + mcObj.yd];
                        let nz = mcObj.field[q - mcObj.zd] - mcObj.field[q + mcObj.zd];
                        const len = Math.hypot(nx, ny, nz);
                        if (len > 0.0001) {
                            nx /= len;
                            ny /= len;
                            nz /= len;
                        } else {
                            nx = 1e-5;
                            ny = 0;
                            nz = 0;
                        }
                        if (nx === 0.0) nx = 1e-5;
                        mcObj.normal_cache[q3] = nx;
                        mcObj.normal_cache[q3 + 1] = ny;
                        mcObj.normal_cache[q3 + 2] = nz;
                        updatedCount++;
                    }
                }
            }
            return updatedCount;
        }

        // Monotonic Solid Core Density Field Generation
        const noiseGen = new FastNoise3D(42);

        function populateDensityField() {
            mc.init(RES);
            const size = RES;
            const half = mc.halfsize;

            for (let z = 0; z < size; z++) {
                const dz = (z - half) / half;
                for (let y = 0; y < size; y++) {
                    const dy = (y - half) / half;
                    for (let x = 0; x < size; x++) {
                        const dx = (x - half) / half;
                        const dist = Math.hypot(dx, dy, dz);

                        if (dist > 0.96) {
                            mc.setCell(x, y, z, 0);
                            continue;
                        }

                        const nFbm = noiseGen.fbm(dx * 2.8, dy * 2.8, dz * 2.8, 3) * 0.09;
                        const distEff = dist + nFbm;
                        const edgeFalloff = dist > 0.82 ? Math.max(0, 1.0 - (dist - 0.82) / 0.13) : 1.0;
                        const smoothEdge = edgeFalloff * edgeFalloff * (3.0 - 2.0 * edgeFalloff);

                        let density;
                        if (distEff <= ISOSURFACE_SCALE) {
                            const t = Math.max(0.0, distEff / ISOSURFACE_SCALE);
                            density = 100.0 - Math.pow(t, 1.4) * 60.0;
                        } else {
                            const t = Math.min(1.0, (distEff - ISOSURFACE_SCALE) / (0.94 - ISOSURFACE_SCALE));
                            density = Math.max(0, 40.0 * (1.0 - t * t));
                        }
                        density *= smoothEdge;
                        mc.setCell(x, y, z, density);
                    }
                }
            }

            mc.isolation = ISOLATION;
            updateNormalCache(mc, 1, size - 2, 1, size - 2, 1, size - 2);
            mc.update();
        }

        // Carve excavation brush with dirty AABB update
        function applyCarve(hitX, hitY, hitZ, dirX, dirY, dirZ, carveRadius, carveDepth, strength = 90.0) {
            const size = RES;
            const t0 = performance.now();

            const minX = Math.max(1, Math.floor(Math.min(hitX, hitX + dirX * carveDepth) - carveRadius) - 1);
            const maxX = Math.min(size - 2, Math.ceil(Math.max(hitX, hitX + dirX * carveDepth) + carveRadius) + 1);
            const minY = Math.max(1, Math.floor(Math.min(hitY, hitY + dirY * carveDepth) - carveRadius) - 1);
            const maxY = Math.min(size - 2, Math.ceil(Math.max(hitY, hitY + dirY * carveDepth) + carveRadius) + 1);
            const minZ = Math.max(1, Math.floor(Math.min(hitZ, hitZ + dirZ * carveDepth) - carveRadius) - 1);
            const maxZ = Math.min(size - 2, Math.ceil(Math.max(hitZ, hitZ + dirZ * carveDepth) + carveRadius) + 1);

            let voxelsModified = 0;
            for (let z = minZ; z <= maxZ; z++) {
                const toZ = z - hitZ;
                for (let y = minY; y <= maxY; y++) {
                    const toY = y - hitY;
                    for (let x = minX; x <= maxX; x++) {
                        const toX = x - hitX;
                        const proj = toX * dirX + toY * dirY + toZ * dirZ;
                        const t = Math.max(0, Math.min(carveDepth, proj));
                        const segX = hitX + dirX * t;
                        const segY = hitY + dirY * t;
                        const segZ = hitZ + dirZ * t;

                        const diffX = x - segX;
                        const diffY = y - segY;
                        const diffZ = z - segZ;
                        const dist = Math.hypot(diffX, diffY, diffZ);

                        if (dist < carveRadius) {
                            const u = 1.0 - (dist / carveRadius);
                            const factor = u * u * (3.0 - 2.0 * u);
                            const current = mc.getCell(x, y, z);
                            if (current > 0) {
                                const nextVal = Math.max(0, current - factor * strength);
                                if (current !== nextVal) {
                                    mc.setCell(x, y, z, nextVal);
                                    voxelsModified++;
                                }
                            }
                        }
                    }
                }
            }

            if (voxelsModified > 0) {
                updateNormalCache(mc, minX - 1, maxX + 1, minY - 1, maxY + 1, minZ - 1, maxZ + 1);
                mc.update();
            }
            const t1 = performance.now();
            return t1 - t0;
        }

        // Benchmark Controller State
        const benchmarkResults = {
            carveDurations: [],
            frameTimes: [],
            fpsList: [],
            summary: {}
        };

        const totalFrames = 450;
        const carveFrames = [60, 120, 180, 240, 300, 360];
        let carvesPerformed = 0;
        let lastTime = performance.now();
        let benchmarkComplete = false;

        populateDensityField();

        // HUD Elements
        const elStatus = document.getElementById('st-status');
        const elFrame = document.getElementById('st-frame');
        const elFps = document.getElementById('st-fps');
        const elFt = document.getElementById('st-ft');
        const elTris = document.getElementById('st-tris');
        const elDraws = document.getElementById('st-draws');
        const elCarves = document.getElementById('st-carves');
        const elCarveDur = document.getElementById('st-carve-dur');
        const elHeap = document.getElementById('st-heap');
        const elProgressBar = document.getElementById('progress-bar');

        elStatus.textContent = "Running Benchmark";

        function animate() {
            if (benchmarkComplete) return;
            requestAnimationFrame(animate);

            const now = performance.now();
            const ft = now - lastTime;
            lastTime = now;

            if (ft > 0) {
                const fps = 1000 / ft;
                benchmarkResults.frameTimes.push(ft);
                benchmarkResults.fpsList.push(fps);
            }

            frameCount++;

            // Camera waypoint choreography (around and through carved corridor distances)
            const angle = (frameCount / totalFrames) * Math.PI * 2;
            const camDist = 3800 + Math.sin(frameCount * 0.04) * 600;
            camera.position.x = Math.cos(angle * 0.7) * camDist;
            camera.position.z = Math.sin(angle * 0.7) * camDist;
            camera.position.y = 1200 + Math.sin(frameCount * 0.02) * 800;
            camera.lookAt(0, 0, 0);

            controls.update();

            // Trigger scheduled carves
            let currentCarveDur = 0;
            if (carveFrames.includes(frameCount)) {
                carvesPerformed++;
                const size = RES;
                const half = mc.halfsize;
                const theta = carvesPerformed * 1.05;
                const phi = 0.3 * carvesPerformed;

                // Excavate along inward surface vectors
                const hitX = half + Math.cos(theta) * (half * 0.75);
                const hitY = half + Math.sin(phi) * (half * 0.65);
                const hitZ = half + Math.sin(theta) * (half * 0.75);
                const dirX = -(hitX - half) / half;
                const dirY = -(hitY - half) / half;
                const dirZ = -(hitZ - half) / half;
                const dirLen = Math.hypot(dirX, dirY, dirZ) || 1.0;

                currentCarveDur = applyCarve(hitX, hitY, hitZ, dirX / dirLen, dirY / dirLen, dirZ / dirLen, 4.5, 9.0, 95.0);
                benchmarkResults.carveDurations.push(currentCarveDur);
                elCarveDur.textContent = currentCarveDur.toFixed(2) + " ms";
                elCarves.textContent = carvesPerformed + " / 6";
            }

            renderer.render(scene, camera);

            // Update HUD
            const triCount = mc.count ? mc.count / 3 : (renderer.info.render.triangles || 0);
            elFrame.textContent = frameCount + " / " + totalFrames;
            elFps.textContent = Math.round(1000 / ft);
            elFt.textContent = ft.toFixed(2);
            elTris.textContent = triCount.toLocaleString();
            elDraws.textContent = renderer.info.render.calls;
            if (performance.memory) {
                elHeap.textContent = (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(1) + " MB";
            }
            elProgressBar.style.width = ((frameCount / totalFrames) * 100) + "%";

            // Complete check
            if (frameCount >= totalFrames && !benchmarkComplete) {
                benchmarkComplete = true;
                elStatus.textContent = "Complete";

                const fts = benchmarkResults.frameTimes;
                const sortedFt = [...fts].sort((a, b) => a - b);
                const avgFt = fts.reduce((a, b) => a + b, 0) / fts.length;
                const p99Ft = sortedFt[Math.floor(sortedFt.length * 0.99)];
                const avgFps = 1000 / avgFt;
                const minFps = 1000 / sortedFt[sortedFt.length - 1];

                const cd = benchmarkResults.carveDurations;
                const avgCarve = cd.length > 0 ? cd.reduce((a, b) => a + b, 0) / cd.length : 0;
                const minCarve = cd.length > 0 ? Math.min(...cd) : 0;
                const maxCarve = cd.length > 0 ? Math.max(...cd) : 0;

                benchmarkResults.summary = {
                    totalFrames,
                    avgFrameTimeMs: Number(avgFt.toFixed(2)),
                    p99FrameTimeMs: Number(p99Ft.toFixed(2)),
                    avgFps: Number(avgFps.toFixed(1)),
                    minFps: Number(minFps.toFixed(1)),
                    trianglesCount: triCount,
                    drawCalls: renderer.info.render.calls,
                    carveCount: cd.length,
                    carveDurationsMs: cd.map(n => Number(n.toFixed(2))),
                    avgCarveDurationMs: Number(avgCarve.toFixed(2)),
                    minCarveDurationMs: Number(minCarve.toFixed(2)),
                    maxCarveDurationMs: Number(maxCarve.toFixed(2)),
                    heapMemoryMb: performance.memory ? Number((performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(2)) : null
                };

                window.__BENCHMARK_RESULTS__ = benchmarkResults;
                console.log("BENCHMARK_COMPLETE");
            }
        }

        let frameCount = 0;
        requestAnimationFrame(animate);
    </script>
</body>
</html>
